function addMonthsToMonthStr(monthStr, delta){
  const [y,m] = monthStr.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

/* Turns a stored contact number into the digits-only format wa.me needs
   (country code + number, no +/spaces/dashes). Assumes Malaysian numbers
   when a leading 0 is used (the shop's home market) — a number already
   typed with a country code (e.g. starting 60 or +1) is left as-is. */
function phoneForWhatsApp(phone){
  let digits = (phone||'').replace(/[^0-9]/g, '');
  if(digits.startsWith('0')) digits = '60' + digits.slice(1);
  return digits;
}
function waLink(phone, message){
  return `https://wa.me/${phoneForWhatsApp(phone)}?text=${encodeURIComponent(message)}`;
}
/* Everything due tomorrow (relative to `dateStr`, so this can be paged) that
   a customer would want a heads-up about: grooming appointments and boarding
   checkouts. Each item comes with a ready-to-send WhatsApp message — tapping
   Send opens WhatsApp with it pre-filled so staff just review and hit send,
   rather than composing each one from scratch every day. */
function computeReminders(dateStr){
  const dayLabel = fmtDateWithDay(dateStr);
  const dateShort = fmtDateSlashYY(dateStr);
  const groomItems = [], checkinItems = [], checkoutItems = [];
  const seenCheckin = new Set(), seenCheckout = new Set();
  state.customers.forEach(cust=>{
    cust.pets.forEach(pet=>{
      (pet.groomingHistory||[]).forEach(g=>{
        if(g.date !== dateStr) return;
        if(g.status === 'Picked up') return; // already done, nothing to remind about
        const message = `Greetings from Cocomomo Old Klang Road!\nJust a gentle reminder that ${pet.name} has a grooming appointment on tomorrow (${dateShort}) at ${fmtTimeAMPM(g.time)}.\nSee you then!`;
        groomItems.push({ cust, pet, record:g, message, sent: !!g.reminderSent, kind:'groom', groomId:g.id });
      });
      (pet.stays||[]).forEach(stay=>{
        if(stay.status !== 'Active') return;
        // Include every pet actually in the room — the row's own pet AND any
        // sharing partners — using each one's OWN resolved check-in/check-out
        // (its per-pet override if set, else the stay's dates), since a
        // sharing partner can now arrive/leave on a different date than the
        // stay it's attached to. Each pet's real owner gets its own reminder.
        stay.pets.forEach(sp=>{
          const memberIds = [sp.petId, ...(sp.sharingWith||[])].filter(Boolean);
          memberIds.forEach(id=>{
            const w = petDatesInStay(stay, sp, id);
            const { pet: memberPet, cust: memberCust } = id===sp.petId ? { pet: findPetAcrossStay(cust, id) || pet, cust } : findPetWithCustomer(id);
            if(!memberPet) return;
            const owner = memberCust || cust;
            if(w.checkIn === dateStr && !seenCheckin.has(`${stay.id}:${id}`)){
              seenCheckin.add(`${stay.id}:${id}`);
              const message = `Greetings from Cocomomo Old Klang Road!\nJust a gentle reminder that ${memberPet.name} are checking in tomorrow, check in time : 10am to 5.45pm. (Closed at 6pm)\n(Additional charges may incur for late check in stated as policies)\nSee you then!`;
              checkinItems.push({ cust: owner, pet: memberPet, record:stay, message, sent: (stay.remindersSent.checkin||[]).includes(id), kind:'checkin', stayId:stay.id, petId:id });
            }
            if(w.checkOut === dateStr && !seenCheckout.has(`${stay.id}:${id}`)){
              seenCheckout.add(`${stay.id}:${id}`);
              const message = `Greetings from Cocomomo Old Klang Road!\nJust a gentle reminder that ${memberPet.name} are checking out tomorrow, check out time : 10am to 3pm.\n(Additional charges may incur for late check out stated as policies)\nSee you then!`;
              checkoutItems.push({ cust: owner, pet: memberPet, record:stay, message, sent: (stay.remindersSent.checkout||[]).includes(id), kind:'checkout', stayId:stay.id, petId:id });
            }
          });
        });
      });
    });
  });
  return { dateStr, dayLabel, groomItems, checkinItems, checkoutItems };
}
function setReminderSent(item, sent){
  if(item.kind==='groom'){
    const groom = (findPetById(item.pet.id)?.groomingHistory||[]).find(g=>g.id===item.groomId);
    if(groom) groom.reminderSent = sent;
  } else {
    const stay = findStayById(item.stayId);
    if(!stay) return;
    const list = stay.remindersSent[item.kind]; // 'checkin' or 'checkout'
    const i = list.indexOf(item.petId);
    if(sent && i===-1) list.push(item.petId);
    if(!sent && i>-1) list.splice(i,1);
  }
  scheduleSync();
}

      <div style="font-weight:700;font-size:13px;margin:14px 0 6px;">🏨 Boarding check-ins (${r.checkinItems.length})</div>

function nightsBetween(a,b){ const d1=new Date(a), d2=new Date(b); return Math.max(0, Math.round((d2-d1)/86400000)); }

   block them (owners sometimes genuinely want multiple bookings in a week). */

  return (pet.stays||[]).find(s => s.id !== excludeStayId && daysBetweenAbs(s.checkIn, checkIn) <= 6);
}
function findNearbyGroomForPet(pet, date, excludeGroomId){

/* Deterministic colour per customer, assigned by their position in your list.
   Same hue at a flat saturation/lightness (like pure rainbow rotation) can still
   look "samey" side by side — a hand-picked set of strongly contrasting colours
   (mixing warm/cool, light/dark, saturated/muted) reads as obviously different
   far more reliably. Past this list, it falls back to a well-spread rotation. */
const CATEGORICAL_COLORS = [
  '#C0392B','#2980B9','#27AE60','#8E44AD','#D68910','#16A085','#C2185B','#34495E',
  '#E67E22','#1ABC9C','#7D3C98','#B03A2E','#2E86C1','#229954','#A04000','#5B2C6F',
  '#117864','#B9770E','#922B21','#1F618D',
  '#D4AC0D','#AD1457','#00838F','#6D4C41','#78909C','#D84315','#6A1B9A','#303F9F',
  '#00695C','#827717','#4527A0','#BF360C','#004D40','#1B5E20','#880E4F','#3E2723',
  '#01579B','#F57F17','#4A148C','#B71C1C',
  '#F1948A','#85C1E9','#82E0AA','#D2B4DE','#F8C471','#76D7C4','#F7DC6F','#F5B7B1',
  '#AED6F1','#A9DFBF','#D7BDE2','#FAD7A0','#A3E4D7','#F0B27A','#C39BD3','#7FB3D5',
];
/* Some palette colours (the new lighter ones especially) are too pale for white
   text to stay readable — pick white or dark ink per colour based on its actual
   luminance, so every swatch stays legible regardless of how light it is. */
function relativeLuminance(hex){
  if(!hex || hex[0] !== '#' || hex.length < 7) return 0; // gradients etc. -> treat as dark, default white text
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const lin = v => v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
}
const INK_LUMINANCE = relativeLuminance('#1E2B25');
function contrastRatio(l1, l2){
  const lighter = Math.max(l1,l2), darker = Math.min(l1,l2);
  return (lighter + 0.05) / (darker + 0.05);
}
/* Picks whichever text colour (white or dark ink) actually contrasts better
   against a given background, rather than a flat brightness cutoff — a flat
   cutoff was still leaving borderline colours (like a light coral) on white
   text even though dark text reads far more clearly against them. */
function textColorFor(bg){
  const bgLum = relativeLuminance(bg);
  const contrastWithWhite = contrastRatio(bgLum, 1);
  const contrastWithDark = contrastRatio(bgLum, INK_LUMINANCE);
  return contrastWithDark > contrastWithWhite ? '#1E2B25' : '#FFFFFF';
}
function avatarStyle(bg){ return `background:${bg};color:${textColorFor(bg)};`; }
function colorFor(id){
  let idx = state.customers.findIndex(c => c.id === id);
  if(idx < 0) idx = 0;
  if(idx < CATEGORICAL_COLORS.length) return CATEGORICAL_COLORS[idx];
  const hue = (idx * 137.508) % 360;
  return `hsl(${hue.toFixed(1)}, 72%, 36%)`;

/* Boarding-calendar-only colouring: assigned per individual STAY (booking),
   not per customer, so the calendar doesn't just mirror a customer's usual
   colour — a repeat customer's separate bookings can land on different
   colours. Every other view (avatars, Today, sidebar) keeps using colorFor()
   and is unaffected.

   Colours are picked per OWNER (not per booking) — every stay belonging to
   the same customer always gets the exact same colour, anywhere on the
   calendar. To still keep bookings that land near each other visually
   distinct, the assignment looks at proximity between OWNERS: if any of
   customer A's stays falls within 5 days of any of customer B's stays,
   they're treated as "nearby" and are never given the same colour. Owners
   who never board anywhere near each other in time can safely reuse a colour. */
function dateRangeGapDays(aIn, aOut, bIn, bOut){
  if(aIn <= bOut && bIn <= aOut) return 0; // overlapping
  if(aOut < bIn) return nightsBetween(aOut, bIn);
  return nightsBetween(bOut, aIn);
}
function computeCalendarColorMap(){
  const NEAR_DAYS = 5;
  // one entry per customer who has at least one stay, each holding their stay date ranges
  const owners = state.customers
    .map(cust=>({
      id: cust.id,
      colorOverride: cust.colorOverride || null,
      ranges: cust.pets.flatMap(pet=>pet.stays.map(s=>({checkIn:s.checkIn, checkOut:s.checkOut}))),
    }))
    .filter(o=>o.ranges.length>0);
  owners.sort((a,b)=> a.ranges[0].checkIn.localeCompare(b.ranges[0].checkIn) || a.id.localeCompare(b.id));

  const anyNear = (a,b) => a.ranges.some(ra => b.ranges.some(rb =>
    dateRangeGapDays(ra.checkIn, ra.checkOut, rb.checkIn, rb.checkOut) <= NEAR_DAYS
  ));

  const assigned = {};
  // Manual overrides are honoured first — auto-assignment for everyone else
  // will then naturally steer clear of any colour someone picked by hand.
  owners.forEach(o=>{ if(o.colorOverride) assigned[o.id] = o.colorOverride; });
  owners.forEach(o=>{
    if(assigned[o.id]) return;
    const usedNearby = new Set();
    owners.forEach(other=>{
      if(other.id===o.id || !assigned[other.id]) return;
      if(anyNear(o, other)) usedNearby.add(assigned[other.id]);
    });
    let chosen = CATEGORICAL_COLORS.find(c=>!usedNearby.has(c));
    if(!chosen){
      // every palette colour is already in use nearby (a lot of overlapping
      // owners) — cycle through by overall order as a reasonable fallback
      chosen = CATEGORICAL_COLORS[Object.keys(assigned).length % CATEGORICAL_COLORS.length];
    }
    assigned[o.id] = chosen;
  });
  return assigned;
}
let _calendarColorMap = {};
function calendarColorFor(custId){
  return _calendarColorMap[custId] || CATEGORICAL_COLORS[0];

function isPetCheckedIn(stay, petId){ return (stay.checkedInPets||[]).includes(petId); }
function setPetCheckedIn(stay, petId, val){

function normalizeBelonging(b){ return { item: b?.item || '', photo: b?.photo || null }; }

    Object.entries(raw).forEach(([petId, v])=>{

function normalizeStayPet(sp){

/* =========================================================
   DATE HELPER
   ========================================================= */
/* Adds n calendar days to a "YYYY-MM-DD" string. Works entirely in UTC date
   components so it never drifts due to the browser's local timezone offset
   (the bug that made "tomorrow" collapse onto "today" in UTC+8). */
function addDays(s,n){
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate()+n);
  return dt.toISOString().slice(0,10);
}
function addMonths(s,n){
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCMonth(dt.getUTCMonth()+n);
  // If the day overflowed into the next month (e.g. Jan 31 + 1 month),
  // clamp to the last day of the intended month instead of skipping ahead.
  if(dt.getUTCDate() !== d) dt.setUTCDate(0);
  return dt.toISOString().slice(0,10);
}

/* A shared stay/payment is only physically stored once, on whichever
   customer created it — but it can now show up on another customer's page
   too (as a sharing partner). These find the real owner so edits, deletes,
   and payments land in the right place regardless of whose page you're on. */
function findStayOwnerCustomer(stayId){
  for(const c of state.customers){
    for(const p of c.pets){
      if(p.stays.some(s=>s.id===stayId)) return c;
    }
  }
  return null;
}
function findPaymentOwner(paymentId){
  for(const c of state.customers){
    if((c.payments||[]).some(p=>p.id===paymentId)) return c;
  }
  return null;
}
/* Like findPetById but also returns the owning customer — used for "sharing
   room with" partners, since those can belong to a different customer than
   the stay itself. */
function findPetWithCustomer(petId){
  for(const c of state.customers){
    const p = c.pets.find(p=>p.id===petId);
    if(p) return { pet:p, cust:c };
  }
  return { pet:null, cust:null };
}
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
/* Display a pet as "Name (Breed)" wherever a pet is listed; falls back to just the name if no breed is set. */
function petLabel(p){
  if(!p) return 'Pet';
  return p.breed ? `${esc(p.name)} (${esc(p.breed)})` : esc(p.name);
}

/* =========================================================
   TODAY — check-in / check-out overview (Yesterday / Today / Tomorrow)
   ========================================================= */
/* Each entry here is now a specific PET's own arrival/departure on `date` —
   not just the stay's own dates — since pets sharing one room can join or
   leave on different days. Pets (primary + any sharing partners) whose own
   date matches are grouped into one card per distinct petId set that shares
   the same actual date, so the common case (everyone on the same dates)
   still shows as a single combined card exactly as before. */
function collectStaysForDate(date){
  const checkins = [], checkouts = [];
  state.customers.forEach(cust=>{
    cust.pets.forEach(pet=>{
      pet.stays.forEach(stay=>{
        stay.pets.forEach(sp=>{
          const memberIds = [sp.petId, ...(sp.sharingWith||[])].filter(Boolean);
          const inGroup = [], outGroup = [];
          memberIds.forEach(id=>{
            const w = petDatesInStay(stay, sp, id);
            if(w.checkIn === date) inGroup.push(id);
            if(w.checkOut === date) outGroup.push(id);
          });
          if(inGroup.length){
            const leadId = inGroup.includes(sp.petId) ? sp.petId : inGroup[0];
            const spPet = findPetAcrossStay(cust, leadId) || pet;
            checkins.push({ cust, pet: spPet, stay, sp, memberIds: inGroup });
          }
          if(outGroup.length){
            const leadId = outGroup.includes(sp.petId) ? sp.petId : outGroup[0];
            const spPet = findPetAcrossStay(cust, leadId) || pet;
            checkouts.push({ cust, pet: spPet, stay, sp, memberIds: outGroup });
          }
        });
      });
    });
  });
  return { checkins, checkouts };
}

/* All grooming appointments (any pet, any customer) scheduled on `date`,
   sorted by time — mirrors collectStaysForDate but for grooming so the
   Today grid can show a third "Grooming" column alongside check-ins/outs. */
function collectGroomingForDate(date){
  const list = [];
  state.customers.forEach(cust=>{
    cust.pets.forEach(pet=>{
      (pet.groomingHistory||[]).forEach(g=>{
        if(g.date === date) list.push({ cust, pet, g });
      });
    });
  });
  list.sort((a,b)=> (a.g.time||'').localeCompare(b.g.time||''));
  return list;
}

    </div>

    const { checkins, checkouts } = collectStaysForDate(sec.date);
    const grooms = collectGroomingForDate(sec.date);

    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const [custId, stayId, memberIdsStr] = btn.dataset.todayUndoCheckin.split('|');
      const cust = getCustomer(custId);
      const owningPet = cust.pets.find(p=>p.stays.some(s=>s.id===stayId));
      const stay = owningPet?.stays.find(s=>s.id===stayId);
      if(stay){ memberIdsStr.split(',').forEach(id=>setPetCheckedIn(stay, id, false)); renderTodayView(); scheduleSync(); toast('Check-in undone'); }
    });
  });
}

/* Names of any pets sharing this room via the row's "Sharing with" checkboxes
   (they don't get their own stay.pets row, so they'd otherwise be invisible
   on the Today grid even though they're physically in the room too). */
function sharingPetLabels(cust, sp){
  return (sp.sharingWith||[])
    .map(id => findPetWithCustomer(id))
    .filter(r => r.pet)
    .map(({pet, cust:owner}) => owner && owner.id!==cust.id ? `${esc(pet.name)} (${esc(owner.name)})` : esc(pet.name));
}
/* Same as sharingPetLabels but appends each pet's own dates when it has a
   per-pet override different from the stay's own dates (e.g. "Rex (own dates:
   14/08/26 → 18/08/26)") — used on the stay card so a staggered booking is
   readable at a glance. */
function sharingPetLabelsWithDates(cust, stay, sp){
  return (sp.sharingWith||[])
    .map(id => ({...findPetWithCustomer(id), id}))
    .filter(r => r.pet)
    .map(({pet, cust:owner, id}) => {
      const base = owner && owner.id!==cust.id ? `${esc(pet.name)} (${esc(owner.name)})` : esc(pet.name);
      const ov = sp.dates && sp.dates[id];
      return ov ? `${base} — own dates: ${fmtDate(ov.checkIn)} → ${fmtDate(ov.checkOut)}` : base;
    });
}
/* Labels for a specific set of petIds (used for a Today-grid group, which
   may be a subset of the full "sharing with" list when some sharing
   partners arrive/leave on a different date than the rest). */
function idsToLabels(ids, primaryCustId){
  return ids.map(id=>findPetWithCustomer(id)).filter(r=>r.pet)
    .map(({pet, cust:owner}) => owner && owner.id!==primaryCustId ? `${esc(pet.name)} (${esc(owner.name)})` : esc(pet.name));
}
function todayCardHtml(cust, pet, stay, sp, memberIds, mode, allowCheckout){
  const key = `${cust.id}|${pet.id}`;
  const ids = memberIds && memberIds.length ? memberIds : [pet.id];
  const allCheckedIn = ids.every(id=>isPetCheckedIn(stay,id));
  const anyCheckedIn = ids.some(id=>isPetCheckedIn(stay,id));
  const canCheckout = mode==='out' && stay.status==='Active' && allowCheckout;
  const canCheckin = mode==='in' && !allCheckedIn && allowCheckout;
  const canUndoCheckin = mode==='in' && anyCheckedIn && allowCheckout;
  const confirmed = (mode==='in' && allCheckedIn) || (mode==='out' && stay.status==='Past');
  const otherLabels = idsToLabels(ids.filter(id=>id!==pet.id), cust.id);
  const petNameDisplay = otherLabels.length ? `${petLabel(pet)} &amp; ${otherLabels.join(' &amp; ')}` : petLabel(pet);
  const groupRiskFlags = ids.some(id=>((findPetById(id)||{}).riskFlags||[]).length>0);
  const idsKey = ids.join(',');
  return `
  <div class="today-card ${confirmed?'today-card-confirmed':''}" data-today-jump="${key}">
    <div class="avatar" style="${avatarStyle(colorFor(cust.id))}">${initials(cust.name)}</div>
    <div class="today-card-main">
      <div class="today-card-pet">${ANIMAL_ICON[pet.type]||'🐾'} ${petNameDisplay}${groupRiskFlags?' <span title="Risk flags — check pet profile" style="color:#A23B2C;">⚠️</span>':''} <span class="badge ${stay.status==='Active'?'badge-active':'badge-past'}">${stay.status}</span>${mode==='in'&&allCheckedIn?' <span class="badge badge-active">Checked in</span>':''}</div>
      <div class="today-card-sub">${esc(cust.name)} · ${esc(cust.phone)}</div>
      ${mode==='out' ? `<div class="today-card-sub">${(cust.authorizedPickups&&cust.authorizedPickups.length) ? `✅ Authorized: ${cust.authorizedPickups.map(a=>`${esc(a.name)} (${esc(a.phone)})`).join(', ')}` : `<span style="color:#A23B2C;">⚠️ No authorized pickup persons on file — verify with owner</span>`}</div>` : ''}
    </div>
    <div class="today-card-room">${esc(sp.room)||'No room'}</div>
    ${canCheckin ? `<button class="btn btn-sm" data-today-checkin="${cust.id}|${stay.id}|${idsKey}">Check in</button>` : ''}
    ${canUndoCheckin ? `<button class="btn btn-sm btn-ghost" data-today-undo-checkin="${cust.id}|${stay.id}|${idsKey}" title="Wrong tap? Undo the check-in">Undo check-in</button>` : ''}
    ${canCheckout ? `<button class="btn btn-sm" data-today-checkout="${cust.id}|${stay.id}">Check out</button>` : ''}
  </div>`;
}

function petBoardingHtml(cust, pet){
  const today = todayStr();
  const all = allStaysForPet(cust, pet);
  const upcoming = all.filter(s => s.checkOut >= today).sort((a,b)=> a.checkIn.localeCompare(b.checkIn));
  const past = all.filter(s => s.checkOut < today).sort((a,b)=> b.checkIn.localeCompare(a.checkIn));
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="section-title" style="margin:0;">Boarding history</div>
      <button class="btn btn-primary btn-sm" data-act="new-stay">+ New stay</button>
    </div>
    ${all.length===0 ? `<div class="placeholder" style="height:140px;"><b>No stays yet</b><div>Start a new boarding stay for ${esc(pet.name)}.</div></div>` : `
      ${upcoming.length ? `<div class="history-group-label">Present &amp; upcoming</div>${upcoming.map(s => stayCardHtml(cust, pet, s)).join('')}` : ''}
      ${past.length ? `<div class="history-group-label">Past</div>${past.map(s => stayCardHtml(cust, pet, s)).join('')}` : ''}
    `}
  `;
}

  const outerWindow = stay.pets.reduce((acc, spRow)=>{
    const w = spRoomWindow(stay, spRow);
    return {
      checkIn: (!acc.checkIn || w.checkIn < acc.checkIn) ? w.checkIn : acc.checkIn,
      checkOut: (!acc.checkOut || w.checkOut > acc.checkOut) ? w.checkOut : acc.checkOut,

/* The "add charge" row: Retail purchase / Others still take a free-typed
   description + amount. Grooming instead offers a preset picker (auto-priced
   off the selected pet's grooming size for Bath/Cut, flat rate for the rest)
   — qty stays freely editable either way. */
function chargeAddRowHtml(stay){
  const ui = getChargeAddState(stay);
  const isGroom = ui.cat === 'Grooming';
  const petOptions = stay.pets.map(sp=>findPetById(sp.petId)).filter(Boolean);
  let selectedPet = petOptions.find(p=>p.id===ui.petId) || petOptions[0];
  let groomOpts = [], selectedOpt = null;
  if(isGroom && selectedPet){
    groomOpts = groomChargeOptionsFor(selectedPet);
    selectedOpt = groomOpts.find(o=>o.key===ui.item) || groomOpts[0];
  }
  return `<div class="charge-add-row" data-charge-add-row="${stay.id}">
    <select data-charge-cat="${stay.id}">
      <option ${ui.cat==='Retail purchase'?'selected':''}>Retail purchase</option>
      <option ${ui.cat==='Grooming'?'selected':''}>Grooming</option>
      <option ${ui.cat==='Others'?'selected':''}>Others</option>
    </select>
    ${isGroom ? `
      ${petOptions.length>1 ? `<select data-charge-groom-pet="${stay.id}">${petOptions.map(p=>`<option value="${p.id}" ${p.id===selectedPet?.id?'selected':''}>${esc(petLabel(p))}</option>`).join('')}</select>` : ''}
      <select data-charge-groom-item="${stay.id}">${groomOpts.map(o=>`<option value="${o.key}" ${o.key===selectedOpt?.key?'selected':''}>${esc(o.label)} — RM${o.amount.toFixed(2)}</option>`).join('')}</select>
      <input type="number" min="1" step="1" placeholder="Qty" value="1" data-charge-newqty="${stay.id}">
      <input type="number" step="0.01" min="0" value="${selectedOpt?selectedOpt.amount.toFixed(2):''}" data-charge-amount="${stay.id}" readonly title="Preset rate — pick a different item to change it" style="background:var(--line-soft);">
    ` : `
      <input placeholder="Item / description…" data-charge-desc="${stay.id}">
      <input type="number" min="1" step="1" placeholder="Qty" value="1" data-charge-newqty="${stay.id}">
      <input type="number" step="0.01" min="0" placeholder="RM each" data-charge-amount="${stay.id}">
    `}
    <button type="button" class="btn btn-sm" data-charge-add="${stay.id}">Add</button>
  </div>`;
}
function chargeRowHtml(stayId, c, editable){
  const qty = +c.qty || 1;

/* Find a stay + its per-pet slot by stayId/petId, searching every customer's
   pets — a shared stay is stored on whichever pet/customer created it, and
   this may be viewed from a different (sharing-partner) customer's page. */
function findStayAndSlot(stayId, petId){
  for(const c of state.customers){
    for(const p of c.pets){
      const stay = p.stays.find(s=>s.id===stayId);
      if(stay){
        const slot = stay.pets.find(sp=>sp.petId===petId);
        if(slot) return { stay, slot };
      }
    }
  }
  return { stay:null, slot:null };
}
function findStayById(stayId){
  for(const c of state.customers){
    for(const p of c.pets){
      const s = p.stays.find(s=>s.id===stayId);
      if(s) return s;
    }
  }
  return null;
}
/* Every stay `pet` is part of, whether it's the pet whose own stay-row it is or
   it's only sharing the room via that row's "Sharing with" list. A stay is still
   physically stored just once (on whichever pet it was created against), so this
   searches across the whole customer's pets rather than duplicating storage —
   which means a shared boarding record shows up in every sharing pet's own
   boarding history, not only the pet it happened to be saved under. */
/* Every stay `pet` is part of — whether it's the pet whose own stay-row it
   is, or it's only sharing the room via that row's "Sharing with" list. A
   stay is stored just once, on whichever pet/customer it was created
   against, so a shared partner's stay lives on someone else's record —
   search every customer, not just this one, so it shows up on both sides. */
function allStaysForPet(cust, pet){
  const out = [];
  const seen = new Set();
  state.customers.forEach(c=>{
    c.pets.forEach(p=>{
      p.stays.forEach(stay=>{
        if(seen.has(stay.id)) return;
        const involved = stay.pets.some(sp => sp.petId===pet.id || (sp.sharingWith||[]).includes(pet.id));
        if(involved){ seen.add(stay.id); out.push(stay); }
      });
    });
  });
  return out;
}

function computeStayCost(stay){
  // group pets by room — includes pets added via "Sharing with" checkboxes too,
  // since they're also physically occupying the room even though they don't
  // get their own stay.pets row. Each occupant carries its OWN checkIn/checkOut
  // (its per-pet override if the stay-pet row set one, else the stay's own
  // dates) so pets that join/leave a shared room on different dates are only
  // charged — and only trigger the sharing surcharge — for the nights they're
  // actually there.
  const byRoom = {};
  const seenPerRoom = {};
  stay.pets.forEach(sp => {
    const room = sp.room;
    if(!byRoom[room]){ byRoom[room] = []; seenPerRoom[room] = new Set(); }
    if(!seenPerRoom[room].has(sp.petId)){
      seenPerRoom[room].add(sp.petId);
      byRoom[room].push({ petId: sp.petId, ...petDatesInStay(stay, sp, sp.petId) });
    }
    (sp.sharingWith||[]).forEach(sharedId=>{
      if(!seenPerRoom[room].has(sharedId)){
        seenPerRoom[room].add(sharedId);
        byRoom[room].push({ petId: sharedId, ...petDatesInStay(stay, sp, sharedId) });
      }
    });
  });
  let total = 0, holidayUsed=false, extraCount=0, surchargeTotal=0;
  const surchargeByPet = {}; // petId -> { nights, amount } — how many nights THAT pet actually paid the sharing surcharge for, not the whole stay's night count
  Object.entries(byRoom).forEach(([roomId, occupants])=>{
    const room = roomTypeFor(roomId);
    if(!room){ return; }
    const roomCheckIn = occupants.map(o=>o.checkIn).sort()[0];
    const roomCheckOut = occupants.map(o=>o.checkOut).sort().slice(-1)[0];
    const roomNights = nightsBetween(roomCheckIn, roomCheckOut);
    let maxConcurrent = 1;
    for(let n=0;n<roomNights;n++){
      const dateStr = addDays(roomCheckIn, n);
      // only the occupants actually present this specific night
      const presentToday = occupants.filter(o => dateStr >= o.checkIn && dateStr < o.checkOut);
      if(presentToday.length===0) continue;
      maxConcurrent = Math.max(maxConcurrent, presentToday.length);
      const holiday = isHoliday(dateStr);
      if(holiday) holidayUsed = true;
      // determine rate: Dog Deluxe uses boarding size of the pet(s) present that night to pick S/M vs L/XL/XXL
      let rate;
      if(room.type==='Dog Deluxe (Bottom)' || room.type==='Dog Deluxe (Upper)'){
        const anyLarge = presentToday.some(o=>{
          const p = findPetById(o.petId);
          return p && ['L','XL','XXL'].includes(p.boardingSize);
        });
        rate = anyLarge ? LARGE : state.rates[room.type];
      } else {
        rate = state.rates[room.type];
      }
      if(!rate) rate = {normal:0, holiday:0};
      const usingCustomRate = stay.customRate != null && stay.customRate >= 0;
      const standardRate = holiday ? rate.holiday : rate.normal;
      let nightRate = standardRate;
      if(usingCustomRate){
        nightRate = stay.customRateMode === 'percent'
          ? standardRate * (1 - Math.min(stay.customRate,100)/100)
          : stay.customRate;
      }
      total += nightRate; // room charged once per occupied night, regardless of how many pets are in it that night
      if(presentToday.length>1){
        // every pet after the first present that night pays a per-night surcharge, based on its own size
        presentToday.slice(1).forEach(o=>{
          const p = findPetById(o.petId);
          const isLarge = p && ['L','XL','XXL'].includes(p.boardingSize);
          const amt = isLarge ? state.surchargeLXL : state.surchargeSM;
          total += amt;
          surchargeTotal += amt;
          if(!surchargeByPet[o.petId]) surchargeByPet[o.petId] = { nights:0, amount:0 };
          surchargeByPet[o.petId].nights++;
          surchargeByPet[o.petId].amount += amt;
        });
      }
    }
    if(maxConcurrent>1) extraCount = Math.max(extraCount, maxConcurrent-1);
  });
  const chargesTotal = (stay.charges||[]).reduce((s,c)=>s+(+c.amount||0)*(+c.qty||1),0);
  const paidChargesTotal = (stay.charges||[]).filter(c=>c.paid).reduce((s,c)=>s+(+c.amount||0)*(+c.qty||1),0);
  total += chargesTotal;
  return { total, holidayUsed, extraCount, surchargeTotal, surchargeByPet, chargesTotal, paidChargesTotal, usingCustomRate: stay.customRate != null && stay.customRate >= 0 };
}

/* A payment can now be linked to more than one stay at once — a "combined
   bill" for a customer who pays for two separate bookings in one go. This
   works out what a given stay actually owes: if none of its payments are
   shared with another stay, it's just that stay's own cost vs its own
   payments (as before). If a payment ties it to other stay(s), the whole
   linked group's costs and payments are pooled together so the outstanding
   balance reflects the combined bill rather than double-counting or
   under-counting a shared payment. `balance` is positive when money is still
   owed, negative when the customer has overpaid. */
/* The Paid/Unpaid marker on a charge is a LABEL only — it does not affect
   the balance here. A charge marked "paid" is assumed to already be folded
   into a recorded Payment/deposit for this stay (that's how it got paid),
   so subtracting it again on top of the Payments total would double-deduct
   it. `paidChargesTotal` is still returned for display (so staff can see
   how much of the additional charges is already settled) but isn't
   subtracted from `balance`. */
/* Splits a stay's own [checkIn, checkOut) into a "paid so far" chunk and a
   "not yet paid" chunk based on stay.paidThrough — e.g. originally booked
   14→16 Aug and paid in full, then extended to 14→18 Aug: paidThrough stays
   at 16, so this reports 2 nights paid (14,15) and 2 nights not yet paid
   (16,17). Purely for display — see the note on `paidThrough` above. */
function stayPaidNightsSplit(stay){
  const totalNights = nightsBetween(stay.checkIn, stay.checkOut);
  if(!stay.paidThrough || stay.paidThrough <= stay.checkIn){
    return { totalNights, paidNights: 0, unpaidNights: totalNights, paidThrough: null };
  }
  const cappedThrough = stay.paidThrough > stay.checkOut ? stay.checkOut : stay.paidThrough;
  const paidNights = nightsBetween(stay.checkIn, cappedThrough);
  return { totalNights, paidNights, unpaidNights: totalNights - paidNights, paidThrough: cappedThrough };
}
/* Turns computeStayCost's per-pet surcharge breakdown into the "(...)" note
   shown next to the additional-pet surcharge line — each extra pet's OWN
   actual night count, not the whole stay's, since a sharing pet with its own
   shorter date range only pays (and should only show) surcharge nights for
   the nights it was actually there. */
function surchargePetLabel(surchargeByPet){
  const entries = Object.entries(surchargeByPet||{});
  if(entries.length===0) return '';
  return entries.map(([petId, info])=>{
    const p = findPetById(petId);
    const name = p ? esc(p.name) : 'extra pet';
    return `${name} sharing, ${info.nights} night${info.nights===1?'':'s'}`;
  }).join(' · ');
}
function computeStayBilling(cust, stay){
  const cost = computeStayCost(stay);
  const stayPayments = (cust.payments||[]).filter(p=>(p.stayIds||[]).includes(stay.id));
  const groupStayIds = new Set([stay.id]);
  stayPayments.forEach(p=>(p.stayIds||[]).forEach(id=>groupStayIds.add(id)));
  const isMerged = groupStayIds.size > 1;
  if(!isMerged){
    const paid = stayPayments.reduce((s,p)=>s+(+p.amount||0),0);
    return { paid, balance: cost.total - paid, isMerged:false, groupCost:cost.total, groupStayCount:1, paidChargesTotal: cost.paidChargesTotal };
  }
  const groupStays = Array.from(groupStayIds).map(id => id===stay.id ? stay : findStayById(id)).filter(Boolean);
  const groupCosts = groupStays.map(st=>computeStayCost(st));
  const groupCost = groupCosts.reduce((s,c)=>s+c.total,0);
  const groupPaidCharges = groupCosts.reduce((s,c)=>s+c.paidChargesTotal,0);
  const seenPayIds = new Set();
  let groupPaid = 0;
  (cust.payments||[]).forEach(p=>{
    if(!seenPayIds.has(p.id) && (p.stayIds||[]).some(id=>groupStayIds.has(id))){
      seenPayIds.add(p.id);
      groupPaid += (+p.amount||0);
    }
  });
  return { paid: groupPaid, balance: groupCost - groupPaid, isMerged:true, groupCost, groupStayCount: groupStays.length, paidChargesTotal: groupPaidCharges };
}

function isHoliday(dateStr){
  return state.holidays.some(h => dateStr >= h.start && dateStr <= h.end);
}
function holidayFor(dateStr){
  return state.holidays.find(h => dateStr >= h.start && dateStr <= h.end) || null;
}
function getWeekdayIndex(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d)).getUTCDay();
}
function closedDateFor(dateStr){
  if((state.closedWeekdays||[]).includes(getWeekdayIndex(dateStr))){
    return { id:'weekly-'+getWeekdayIndex(dateStr), name:`Closed every ${WEEKDAY_NAMES[getWeekdayIndex(dateStr)]}`, start:dateStr, end:dateStr, weekly:true };
  }
  return (state.closedDates||[]).find(c => dateStr >= c.start && dateStr <= c.end) || null;
}
function isClosedDate(dateStr){
  return !!closedDateFor(dateStr);
}

/* Staff on leave for a given date — returns the matching staff members
   (each with the specific leave entry that covers this date), used by the
   Today grid, Boarding calendar, and Grooming availability grid so leave is
   visible wherever staff are scheduling work. */
function staffOnLeaveFor(dateStr){
  const out = [];
  (state.staff||[]).forEach(s=>{
    const leave = (s.leaves||[]).find(l => dateStr >= l.start && dateStr <= l.end);
    if(leave) out.push({ staff: s, leave });
  });
  return out;
}

/* Is `roomId` free for the [checkIn, checkOut) window? Checks every stay across
   every customer, skipping the stay being edited (excludeStayId) so a room already
   assigned within that same stay doesn't flag itself. Two ranges overlap when
   newCheckIn < otherCheckOut && otherCheckIn < newCheckOut (checkout day = room turns over). */
function isRoomAvailable(roomId, checkIn, checkOut, excludeStayId){
  if(!checkIn || !checkOut) return true;
  for(const c of state.customers){
    for(const p of c.pets){
      for(const s of p.stays){
        if(s.id === excludeStayId) continue;
        for(const sp of s.pets){
          if(sp.room !== roomId) continue;
          const w = spRoomWindow(s, sp);
          if(checkIn < w.checkOut && w.checkIn < checkOut) return false;
        }
      }
    }
  }
  return true;
}

/* Resize/compress an image file client-side before storing it (keeps cloud sync fast). */
function compressImage(file, maxDim=1000, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Invalid image'));
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function openPhotoLightbox(dataUrl){
  const div = document.createElement('div');
  div.className = 'lightbox-backdrop';
  div.innerHTML = `<button class="lightbox-close">✕</button><img src="${dataUrl}">`;
  div.addEventListener('click', (e)=>{ if(e.target===div || e.target.classList.contains('lightbox-close')) div.remove(); });
  document.body.appendChild(div);
}

/* =========================================================
   MODALS — generic helpers
   ========================================================= */
function openModal(html, {wide=false}={}){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="mBackdrop"><div class="modal ${wide?'wide':''}">${html}</div></div>`;
  document.getElementById('mBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='mBackdrop') closeModal(); });
  root.querySelectorAll('.modal-close').forEach(b=>b.addEventListener('click', closeModal));
  // Enter anywhere in the modal triggers the primary action (Save/Book/Add etc.),
  // like a normal form submit — except inside a textarea (needs real newlines)
  // or a multi-select's "Add custom…" input (Enter there adds the chip instead,
  // handled by its own listener in wireMultiSelectEditor).
  root.querySelector('.modal').addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter') return;
    if(e.target.tagName === 'TEXTAREA') return;
    if(e.target.id && e.target.id.endsWith('_customInput')) return;
    e.preventDefault();
    const primaryBtn = root.querySelector('.modal-foot .btn-primary');
    if(primaryBtn) primaryBtn.click();
  });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function allCustomerStays(cust){

  cust.pets.forEach(pet=>{

/* ---- Boarding agreement: signature pad + sign/view modal ---- */
function initSignaturePad(canvas){
  const ctx = canvas.getContext('2d');
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio; canvas.height = rect.height * ratio;
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1E2B25';
  let drawing = false, hasInk = false, last = null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  }
  function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
  function move(e){
    if(!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; hasInk = true;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false}); canvas.addEventListener('touchmove', move, {passive:false}); canvas.addEventListener('touchend', end);
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk = false; },
    isEmpty(){ return !hasInk; },
    dataUrl(){ return canvas.toDataURL('image/png'); },
  };
}

/* Remote signing: a random unguessable token is written to the dedicated,
   locked-down `agreement_signing` table (not the main customer database).
   The public signing page can only ever look up / sign that one token via
   two narrow RPC functions — it never touches your customer data directly. */
async function copyRemoteSigningLink(cust){
  if(!cloudEnabled || !sbSession){ toast('Sign in to cloud sync first — remote signing needs it'); return; }
  const token = cust.agreementToken || (uid('tok') + uid('tok'));
  try{
    const { error } = await sb.from('agreement_signing').upsert({
      token, customer_id: cust.id, customer_name: cust.name,
      policy_text: state.policyText, signed: false,
    });
    if(error) throw error;
    if(cust.agreementToken !== token){ cust.agreementToken = token; renderCustomersMain(); scheduleSync(); }
  }catch(err){
    console.error(err);
    toast('Could not create the signing link — ' + describeSupabaseError(err));
    return;
  }
  const base = SIGNING_PAGE_BASE || location.href.replace(/[^/]*$/, '');
  const link = `${base}sign-agreement.html?token=${encodeURIComponent(token)}`;
  navigator.clipboard?.writeText(link).then(()=>{
    toast('Link copied — paste it to the customer');
  }).catch(()=>{
    toast('Could not copy automatically — link: ' + link);
  });
}

/* Pull in any agreements that were signed remotely since we last checked. */
async function checkSignedAgreements(){
  if(!cloudEnabled || !sbSession) return;
  const pending = state.customers.filter(c => c.agreementToken && !c.agreement);
  if(pending.length===0) return;
  try{
    const tokens = pending.map(c=>c.agreementToken);
    const { data, error } = await sb.from('agreement_signing').select('token,signed,signed_name,signature_data_url,signed_at,policy_text').in('token', tokens);
    if(error) throw error;
    let changed = false;
    (data||[]).forEach(row=>{
      if(!row.signed) return;
      const cust = pending.find(c=>c.agreementToken===row.token);
      if(cust && !cust.agreement){
        cust.agreement = { signedName: row.signed_name, signedAt: row.signed_at, policyTextSnapshot: row.policy_text, signatureDataUrl: row.signature_data_url };
        changed = true;
      }
    });
    if(changed){ render(); toast('A remote signature came in'); }
  }catch(err){ console.error('checkSignedAgreements failed', err); }
}

      logFieldChanges('Pet', {petId: existing.id}, existing.name, existing, data, ['medical','personality','special'], {medical:'Medical condition', personality:'Personality', special:'Special requests'});
      Object.assign(existing, data);
    }
    else{ const np = {...data, id:uid('pet'), photo:null, stays:[], groomingHistory:[]}; cust.pets.push(np); state.selectedPetId = np.id; }
    closeModal(); renderCustomersMain(); toast(existing?'Pet updated':'Pet added');
  });
}

function openPaidThroughModal(stay, onSaved){
  const nightsSplit = stayPaidNightsSplit(stay);
  openModal(`
    <div class="modal-head"><h3>Mark nights paid</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">Useful when a stay gets extended after the original nights were already paid for — set the date up to which the customer has already paid (their original check-out date, for example). This is a status label only; it doesn't change the outstanding balance, which is still tracked via Payments.</div>
      <div class="form-grid c3">
        <div class="field"><label>Nights paid through</label><div class="date-overlay-wrap"><input type="date" id="pt_through" min="${stay.checkIn}" max="${stay.checkOut}" value="${nightsSplit.paidThrough || stay.checkOut}"><span class="date-overlay-label" id="pt_through_wd">${fmtDateSlashDay(nightsSplit.paidThrough || stay.checkOut)}</span></div></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  `);
  document.getElementById('pt_through').addEventListener('change', (e)=>{
    document.getElementById('pt_through_wd').textContent = fmtDateSlashDay(e.target.value);
  });
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', ()=>{
    const through = document.getElementById('pt_through').value;
    if(!through || through < stay.checkIn || through > stay.checkOut){ toast('Please pick a date within the stay'); return; }
    stay.paidThrough = through;
    closeModal();
    scheduleSync();
    toast('Nights paid updated');
    if(onSaved) onSaved();
  });
}

    document.getElementById('stayPetRows').innerHTML = workingPets.map((sp,idx)=>stayPetRowHtml(cust, sp, idx)).join('');
    wireStayRowEvents();
  }
  function wireStayRowEvents(){
    document.querySelectorAll('[data-stayrow-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = +btn.dataset.stayrowRemove;
        if(workingPets.length<=1){ toast('A stay needs at least one pet'); return; }
        workingPets.splice(idx,1); refreshStayRows();
      });
    });
    document.querySelectorAll('[data-stayrow-pet]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ workingPets[+sel.dataset.stayrowPet].petId = sel.value; refreshStayRows(); });
    });
    document.querySelectorAll('[data-stayrow-room]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ workingPets[+sel.dataset.stayrowRoom].room = sel.value; });
    });
    document.querySelectorAll('[data-stayrow-feeding]').forEach(ta=>{
      ta.addEventListener('input', ()=>{ workingPets[+ta.dataset.stayrowFeeding].feeding = ta.value; });
    });
    workingPets.forEach((sp,idx)=>{
      if(!sp.dates) sp.dates = {};
      wireSharingPicker(`srow_share_${idx}`, sp.sharingWith, () => workingPets[idx].petId, sp.dates,
        () => ({ checkIn: document.getElementById('s_in').value, checkOut: document.getElementById('s_out').value }));
    });
    document.querySelectorAll('[data-add-belonging]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = +btn.dataset.addBelonging;
        const input = document.querySelector(`[data-belonging-input="${idx}"]`);
        const val = input.value.trim();
        if(!val) return;
        workingPets[idx].belongings.push({item:val, photo:null});
        input.value='';
        refreshStayRows();
      });
    });
    document.querySelectorAll('[data-remove-belonging]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const [idx,bidx] = btn.dataset.removeBelonging.split('-').map(Number);
        workingPets[idx].belongings.splice(bidx,1);
        refreshStayRows();
      });
    });
    document.querySelectorAll('[data-modal-attach-belonging]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        _pendingModalBelonging = btn.dataset.modalAttachBelonging;
        document.getElementById('stayBelongingFileInput').click();
      });
    });
    document.querySelectorAll('[data-modal-view-belonging]').forEach(img=>{
      img.addEventListener('click', ()=>{
        const [idx,bidx] = img.dataset.modalViewBelonging.split(':').map(Number);
        openPhotoLightbox(workingPets[idx].belongings[bidx].photo);
      });
    });
  }
  let _pendingModalBelonging = null;
  document.getElementById('stayBelongingFileInput').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    const target = _pendingModalBelonging;
    e.target.value = '';
    _pendingModalBelonging = null;
    if(!file || !target) return;
    const [idx,bidx] = target.split(':').map(Number);
    try{
      const dataUrl = await compressImage(file);
      workingPets[idx].belongings[bidx].photo = dataUrl;
      refreshStayRows();
      toast('Photo attached');
    }catch(err){ console.error(err); toast('Could not read that image'); }
  });
  function stayPetRowHtml(cust, sp, idx){
    const pet = getPet(cust, sp.petId) || cust.pets[0];
    const rooms = ROOM_INVENTORY.filter(r => r.animal === pet.type);
    const checkIn = document.getElementById('s_in')?.value || s.checkIn;
    const checkOut = document.getElementById('s_out')?.value || s.checkOut;
    // this row's own occupied window — the union of this pet's + its sharing
    // partners' dates (their per-pet overrides if set, else the stay's own
    // dates above) — used for room-availability checks, not the bare stay window.
    const rowWindow = spRoomWindow({checkIn, checkOut}, sp);
    return `
    <div style="border:1px solid var(--line-soft);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--panel-2);">
      <div class="repeat-row">
        <div class="field">
          <label>Pet</label>
          <select data-stayrow-pet="${idx}">${cust.pets.map(p=>`<option value="${p.id}" ${p.id===sp.petId?'selected':''}>${ANIMAL_ICON[p.type]} ${petLabel(p)}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Room assignment</label>
          <select data-stayrow-room="${idx}">
            <option value="">— select room —</option>
            ${rooms.map(r=>{
              const occupied = r.id !== sp.room && !isRoomAvailable(r.id, rowWindow.checkIn, rowWindow.checkOut, existing?.id);
              return `<option value="${r.id}" ${r.id===sp.room?'selected':''} ${occupied?'disabled':''}>${r.id} · ${r.type}${occupied?' — occupied':''}</option>`;
            }).join('')}
          </select>
          ${sp.room && !isRoomAvailable(sp.room, rowWindow.checkIn, rowWindow.checkOut, existing?.id) ? `<div style="color:var(--danger);font-size:11.5px;font-weight:600;margin-top:4px;">⚠ ${esc(sp.room)} is booked by another stay for these dates — please pick a different room.</div>` : ''}
        </div>
        ${workingPets.length>1 ? `<button type="button" class="mini-remove" data-stayrow-remove="${idx}">✕</button>` : ''}
      </div>
      ${riskFlagBadgesHtml(pet) ? `<div style="margin-bottom:8px;">${riskFlagBadgesHtml(pet)}</div>` : ''}
      ${sharingPickerHtml(`srow_share_${idx}`, sp.sharingWith, null, sp.dates)}
      <div class="field" style="margin-bottom:8px;">
        <label>Feeding instructions (this stay)</label>
        <textarea data-stayrow-feeding="${idx}">${esc(sp.feeding)}</textarea>
      </div>
      <div class="field">
        <label>Belongings</label>
        <div class="belonging-list" style="margin-bottom:6px;">
          ${sp.belongings.map((b,bidx)=>{
            const bkey = `${idx}:${bidx}`;
            const photoPart = b.photo
              ? `<img class="belonging-photo" src="${b.photo}" data-modal-view-belonging="${bkey}" title="View photo">`
              : `<button type="button" class="belonging-cam" data-modal-attach-belonging="${bkey}" title="Attach photo">📷</button>`;
            return `<div class="belonging-chip">${photoPart} ${esc(b.item)} <button type="button" class="belonging-x" data-remove-belonging="${idx}-${bidx}" title="Remove">✕</button></div>`;
          }).join('')}
        </div>
        <div style="display:flex;gap:6px;">
          <input placeholder="Item brought by owner…" data-belonging-input="${idx}" style="flex:1;padding:7px 9px;border:1px solid var(--line);border-radius:7px;">
          <button type="button" class="btn btn-sm" data-add-belonging="${idx}">Add</button>

      </div>
    </div>`;
  }
  function allPetsExcept(cust, ids){ return cust.pets.filter(p=>!ids.includes(p.id)); }
  wireStayRowEvents();

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    const checkIn = document.getElementById('s_in').value;
    const checkOut = document.getElementById('s_out').value;
    if(!checkIn || !checkOut || checkOut < checkIn){ toast('Please provide valid check-in/check-out dates'); return; }
    if(workingPets.some(w=>!w.room)){ toast('Please assign a room to every pet in the stay'); return; }
    const inClosed = closedDateFor(checkIn);
    const outClosed = closedDateFor(checkOut);
    if(inClosed && !(workingDropoff.time && workingDropoff.contactName && workingDropoff.contactPhone)){
      toast('Check-in falls on a closed day — please fill in the drop-off time and contact details');
      return;
    }
    if(outClosed && !(workingPickup.time && workingPickup.contactName && workingPickup.contactPhone)){
      toast('Check-out falls on a closed day — please fill in the pick-up time and contact details');
      return;
    }
    for(const w of workingPets){
      for(const [petId, d] of Object.entries(w.dates||{})){
        if(!d.checkIn || !d.checkOut || d.checkOut < d.checkIn){
          const { pet: badPet } = findPetWithCustomer(petId);
          toast(`${badPet?badPet.name+"'s":'That pet\'s'} own dates in the sharing section aren't valid`);
          return;
        }
      }
    }
    const conflictRoom = workingPets.find(w => { const rw = spRoomWindow({checkIn, checkOut}, w); return !isRoomAvailable(w.room, rw.checkIn, rw.checkOut, existing?.id); });
    if(conflictRoom){ toast(`${conflictRoom.room} is already booked for these dates — please choose a different room`); return; }
    for(const w of workingPets){
      const wPet = findPetAcrossStay(cust, w.petId);
      if(wPet && !confirmIfNearbyStay(wPet, checkIn, existing?.id)) return;
    }
    const { customRate, customRateMode } = readCustomRate('s_rate');
    const payload = {
      checkIn, checkOut, status:document.getElementById('s_status').value, notes:document.getElementById('s_notes').value, customRate, customRateMode, pets:workingPets,
      dropoff: inClosed ? {...workingDropoff} : null,
      pickup: outClosed ? {...workingPickup} : null,
    };
    const doSave = ()=>{
      let freeResult = { assignedCount:0, movedCount:0, assignedList:[] };
      if(existing){
        // Snapshot each pet's window as it stood BEFORE this edit (used to
        // widen the search for this stay's own FBG appointments below) —
        // must be read before Object.assign overwrites checkIn/checkOut/pets.
        const oldWindowsByPetId = {};
        (existing.pets||[]).forEach(w=>{
          [w.petId, ...(w.sharingWith||[])].filter(Boolean).forEach(id=>{
            oldWindowsByPetId[id] = petDatesInStay(existing, w, id);
          });
        });
        logFieldChanges('Stay', {stayId: existing.id}, primaryPet.name, existing, payload,
          ['checkIn','checkOut','customRate','notes'],
          {checkIn:'Check-in date', checkOut:'Check-out date', customRate:'Special rate', notes:'Notes'});
        Object.assign(existing, payload);
        // Re-check FBG entitlement after an edit — e.g. checkout pushed later
        // and the stay now crosses another 7-night threshold. Reconciles
        // rather than blindly adding: appointments already "Done & Informed"
        // or "Picked up" are left untouched; any other existing FBG for this
        // stay gets moved to the newly-correct date instead of leaving it
        // stranded next to a fresh duplicate; only creates new ones once no
        // reusable appointment is left.
        if(existing.status === 'Active'){
          const petWindows = existing.pets.flatMap(w => [w.petId, ...(w.sharingWith||[])].filter(Boolean).map(id=>({ petId:id, ...petDatesInStay(existing, w, id) })));
          freeResult = reconcileFreeGroomings(cust, existing, petWindows, oldWindowsByPetId);
        }
      }
      else{
        const newStay = { id:uid('stay'), charges:[], ...payload };
        primaryPet.stays.push(newStay);
        const petWindows = workingPets.flatMap(w => [w.petId, ...(w.sharingWith||[])].filter(Boolean).map(id=>({ petId:id, ...petDatesInStay(newStay, w, id) })));
        freeResult = assignFreeGroomings(cust, petWindows);
      }
      closeModal(); onSaved();
      if(freeResult.assignedCount > 0){
        toast(`Stay ${existing?'updated':'created'} — ${freeResult.assignedCount} free grooming${freeResult.assignedCount===1?'':'s'} auto-booked`);
        openFreeGroomingSummaryModal(freeResult.assignedList);
      } else if(freeResult.movedCount > 0){
        toast(`Stay updated — ${freeResult.movedCount} free grooming${freeResult.movedCount===1?'':'s'} rescheduled to match`);
      } else {
        toast(existing ? 'Stay updated' : 'Stay created');
      }
    };
    const holidayHits = holidayOverlapsForStay(checkIn, checkOut);
    if(holidayHits.length){ openHolidayRateNoticeModal(holidayHits, doSave); } else { doSave(); }
  });
}

/* ---- Bulk-edit add-ons and/or notes across every selected grooming

function openBulkGroomFieldsModal(cust, pet, ids){

          <label class="check-pill"><input type="radio" name="bulk_notes_mode" value="replace" style="width:auto;"> Replace existing notes</label>
        </div>

      </fieldset>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelBtn">Done</button>

  `, {wide:true});
  const getBulkAddons = wireMultiSelectEditor('bulk_addon', ADDONS, []);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('bulkApplyAddonsBtn').addEventListener('click', ()=>{
    const chosen = getBulkAddons();
    if(chosen.length===0){ toast('Pick at least one add-on to apply'); return; }
    const mode = document.querySelector('[name="bulk_addon_mode"]:checked').value;
    let applied = 0;
    pet.groomingHistory.forEach(g=>{
      if(!ids.has(g.id)) return;
      g.addons = mode==='replace' ? [...chosen] : [...new Set([...(g.addons||[]), ...chosen])];
      applied++;
    });
    scheduleSync();
    if(state.activeTab==='customers') renderPetSubContent(cust, pet);
    toast(`Add-ons applied to ${applied} appointment${applied===1?'':'s'}`);
  });
  document.getElementById('bulkApplyNotesBtn').addEventListener('click', ()=>{
    const text = document.getElementById('bulk_notes').value.trim();
    if(!text){ toast('Enter some notes text to apply'); return; }
    const mode = document.querySelector('[name="bulk_notes_mode"]:checked').value;
    let applied = 0;
    pet.groomingHistory.forEach(g=>{
      if(!ids.has(g.id)) return;
      g.notes = mode==='replace' ? text : [g.notes, text].filter(Boolean).join(' · ');
      applied++;
    });
    scheduleSync();
    if(state.activeTab==='customers') renderPetSubContent(cust, pet);
    toast(`Notes applied to ${applied} appointment${applied===1?'':'s'}`);
  });
}

    const conflict = findGroomConflict(date, time, bay, existing?.id);
    if(conflict){ toast(`${bay} is already booked at ${time} on that date`); return; }
    if(!confirmIfNearbyGroom(pet, date, existing?.id)) return;
    const addons = getGAddons();

      time, bay, apptTypes, groomColor: selectedColor,
      sizeCode:document.getElementById('g_size').value, cutCode:document.getElementById('g_cutcode').value, details:document.getElementById('g_details').value,
      addons, notes:document.getElementById('g_notes').value, status:document.getElementById('g_status').value, customerId:cust.id, petId:pet.id,

      return;

    const repeatMode = document.getElementById('g_repeat')?.value || 'none';
    const repeatUntil = document.getElementById('g_repeat_until')?.value;
    if(repeatMode==='none' || !repeatUntil){
      pet.groomingHistory.push({ id:uid('groom'), photos:[], date, ...basePayload });
      closeModal();
      if(state.activeTab==='customers') renderPetSubContent(cust, pet); else render();
      toast('Appointment booked');
      return;
    }
    // Bulk-book a recurring series: step from the first date by the chosen
    // frequency up to (and including) the "repeat until" date. Each occurrence
    // keeps the same time/bay/details — dates where that bay/time is already
    // taken are skipped rather than overwritten, and reported back so staff
    // can manually place those few instead.
    const step = repeatMode==='weekly' ? (d)=>addDays(d,7) : repeatMode==='biweekly' ? (d)=>addDays(d,14) : (d)=>addMonths(d,1);
    let cursor = date;
    let booked = 0, skipped = [], skippedClosed = [];
    while(cursor <= repeatUntil){
      if(isClosedDate(cursor)){
        skippedClosed.push(cursor);
      } else if(findGroomConflict(cursor, time, bay, null)){
        skipped.push(cursor);
      } else {
        pet.groomingHistory.push({ id:uid('groom'), photos:[], date:cursor, ...basePayload });
        booked++;
      }
      cursor = step(cursor);
    }
    closeModal();
    if(state.activeTab==='customers') renderPetSubContent(cust, pet); else render();
    scheduleSync();
    const parts = [];
    if(skipped.length) parts.push(`${skipped.length} skipped (bay already booked): ${skipped.map(fmtDate).join(', ')}`);
    if(skippedClosed.length) parts.push(`${skippedClosed.length} skipped (shop closed): ${skippedClosed.map(fmtDate).join(', ')}`);
    if(parts.length){
      toast(`Booked ${booked} appointment${booked===1?'':'s'} — ${parts.join('; ')}`);
    } else {
      toast(`Booked ${booked} appointment${booked===1?'':'s'}`);
    }
  });
}

/* Is `pet` currently boarding on `dateStr`? Checked inclusive of the check-out
   day, since staff want the grooming note to flag it even on checkout day. */
function isPetBoardingOnDate(pet, dateStr){
  if(!pet || !dateStr) return false;
  return pet.stays.some(s => dateStr >= s.checkIn && dateStr <= s.checkOut);
}
/* Adds/removes a "(Boarding)" tag at the start of a notes field, based on
   whether the pet is currently detected as boarding on the selected date —
   without duplicating the tag or disturbing anything else staff typed. */
function applyBoardingNoteTag(notesEl, isBoarding){
  const val = notesEl.value;
  const hasTag = /^\(Boarding\)\s*/.test(val);
  if(isBoarding && !hasTag){
    notesEl.value = val ? `(Boarding) ${val}` : '(Boarding)';
  } else if(!isBoarding && hasTag){
    notesEl.value = val.replace(/^\(Boarding\)\s*/, '');
  }
}

function findGroomConflict(date, time, bay, excludeId){
  for(const c of state.customers){
    for(const p of c.pets){
      for(const g of p.groomingHistory){
        if(g.id===excludeId) continue;
        if(g.date===date && g.time===time && g.bay===bay) return g;
      }
    }
  }
  return null;
}

/* Loyalty reward: dogs boarding 7+ nights earn 1 free Basic grooming per every
   7 nights, floor-rounded (e.g. 17 nights -> 2 free groomings). Rather than
   fixed 7-night intervals (which would leave an uneven leftover), the earned
   groomings are spread evenly across the stay so the LAST one always lands
   exactly on the check-out date — e.g. 17 nights / 2 groomings -> spaced every
   ~9 nights, ending on check-out, instead of a lopsided 7-then-7-then-3. */
function computeFreeGroomingDates(checkIn, checkOut){
  const nights = nightsBetween(checkIn, checkOut);
  const entitled = Math.floor(nights / 7);
  if(entitled <= 0) return [];
  const interval = Math.ceil(nights / entitled);
  const dates = [];
  for(let i=0;i<entitled;i++){
    const offsetFromCheckout = (entitled - 1 - i) * interval;
    dates.push(addDays(checkOut, -offsetFromCheckout));
  }
  return dates;
}
/* Preferred bay/time on a given date, falling back gracefully if taken:
   preferred bay at the preferred time -> preferred bay at any time -> any
   open bay/time at all. Keeps the free grooming off a real booking's slot.
   `excludeId` lets a slot search ignore one specific grooming record (used
   when moving an existing FBG appointment to a new date/time). */
function findFreeGroomSlot(date, prefTime, prefBay, excludeId){
  const time0 = prefTime || TIME_SLOTS[0];
  const bay0 = prefBay || BAYS[0];
  if(!findGroomConflict(date, time0, bay0, excludeId)) return { time: time0, bay: bay0 };
  for(const time of TIME_SLOTS){
    if(!findGroomConflict(date, time, bay0, excludeId)) return { time, bay: bay0 };
  }
  for(const time of TIME_SLOTS){
    for(const bay of BAYS){
      if(!findGroomConflict(date, time, bay, excludeId)) return { time, bay };
    }
  }
  return null;
}
/* Auto-creates the earned free groomings for any DOG among `petIds` on a newly
   booked stay — including any pets sharing the room, not just the one the
   stay was booked under, since they're physically boarding too. A sharing
   partner can belong to a different customer, so each pet's record is
   attributed to its own owner rather than assumed to be `cust`.
   The appointment is a normal, fully editable grooming record — staff can
   add on Full Grooming etc. if the owner wants to upgrade it.
   Mid-stay free groomings default to 4pm at Bay 3; the one that lands on the
   check-out day defaults to 10am at Bay 3 (falling back to another slot only
   if that one's already taken). Returns the count assigned plus the list of
   records created, so the caller can show them for a quick review/edit. */
/* `petWindows` is an array of {petId, checkIn, checkOut} — each pet's OWN
   actual dates (its per-pet override if the stay-pet row set one, else the
   stay's own dates), so a pet sharing a room but arriving/leaving on a
   different date only earns FBGs for the nights it's actually boarding.
   Idempotent — skips any date that already has an auto-assigned FBG
   ("(Boarding)") for that pet, so it's safe to call again after a stay's
   dates are edited (e.g. check-out pushed later, crossing another 7-night
   threshold) without duplicating groomings already booked. */
function assignFreeGroomings(cust, petWindows){
  let assignedCount = 0;
  const assignedList = [];
  const seen = new Set();
  petWindows.filter(w=>w && w.petId && !seen.has(w.petId) && seen.add(w.petId)).forEach(({petId, checkIn, checkOut})=>{
    const { pet, cust: petCust } = findPetWithCustomer(petId);
    if(!pet || pet.type !== 'Dog') return;
    const owner = petCust || cust;
    const dates = computeFreeGroomingDates(checkIn, checkOut);
    dates.forEach((date, idx)=>{
      const alreadyHas = (pet.groomingHistory||[]).some(g=>(g.apptTypes||[]).includes('FBG') && g.date===date && g.notes==='(Boarding)');
      if(alreadyHas) return;
      const isCheckoutDay = idx === dates.length - 1;
      const slot = findFreeGroomSlot(date, isCheckoutDay ? '10:00' : '16:00', 'Bay 3');
      if(!slot) return;
      const record = {
        id: uid('groom'), date, time: slot.time, bay: slot.bay,
        apptTypes: ['FBG'], sizeCode: pet.groomingSize || '', cutCode:'', details:'',
        addons: [], photos: [], status:'Not arrived',
        notes: '(Boarding)',
        customerId: owner.id, petId: pet.id,
      };
      pet.groomingHistory.push(record);
      assignedList.push({ cust: owner, pet, record });
      assignedCount++;
    });
  });
  return { assignedCount, assignedList };
}
/* Used when SAVING AN EDIT to an existing stay (not on first creation) —
   reconciles this pet's FBG appointments against its newly entitled dates
   instead of just adding on top. `oldWindowsByPetId` is each pet's window
   *before* this edit (keyed by petId), used only to widen the search for
   "this stay's own FBG appointments" so a shortened or shifted window still
   finds them (a pet's stays don't normally overlap, so this is a safe scope
   without needing a stored stay id).
   Any appointment already at status "Done & Informed" or "Picked up" is
   left completely untouched and its date still counts as fulfilling that
   slot. Any other existing FBG appointment for this stay ("Not arrived" /
   "In progress") gets REUSED — moved to the correct new date/time/bay
   instead of leaving it stranded and creating a near-duplicate next to it.
   Only creates a brand-new record once there are no more reusable ones left.
   Past dates (before today) are always left alone too, on top of the status
   check — a slot that's already come and gone doesn't get moved, reused, or
   backfilled even if it's still "Not arrived"; only today's and future slots
   are reconciled. */
function reconcileFreeGroomings(cust, stay, petWindows, oldWindowsByPetId){
  let assignedCount = 0, movedCount = 0;
  const assignedList = [];
  const seen = new Set();
  petWindows.filter(w=>w && w.petId && !seen.has(w.petId) && seen.add(w.petId)).forEach(({petId, checkIn, checkOut})=>{
    const { pet, cust: petCust } = findPetWithCustomer(petId);
    if(!pet || pet.type !== 'Dog') return;
    const owner = petCust || cust;
    const newDates = computeFreeGroomingDates(checkIn, checkOut);
    const oldWindow = (oldWindowsByPetId && oldWindowsByPetId[petId]) || { checkIn, checkOut };
    const scopeStart = oldWindow.checkIn < checkIn ? oldWindow.checkIn : checkIn;
    const scopeEnd = oldWindow.checkOut > checkOut ? oldWindow.checkOut : checkOut;
    const linked = (pet.groomingHistory||[]).filter(g =>
      (g.apptTypes||[]).includes('FBG') && g.notes==='(Boarding)' && g.date >= scopeStart && g.date <= scopeEnd);
    // Past dates (before today) are never touched, regardless of status —
    // only today's and future FBG slots get reconciled. This also means a
    // needed date that's already in the past is simply skipped rather than
    // backfilled, since a missed/past slot "doesn't need adjusting".
    const today = todayStr();
    const lockedDates = new Set(linked.filter(g => g.status==='Done & Informed' || g.status==='Picked up' || g.date < today).map(g=>g.date));
    const movablePool = linked.filter(g => g.status!=='Done & Informed' && g.status!=='Picked up' && g.date >= today);
    const neededDates = newDates.filter(d => !lockedDates.has(d) && d >= today);
    neededDates.forEach((date, idx)=>{
      const exactIdx = movablePool.findIndex(g=>g.date===date);
      if(exactIdx>-1){ movablePool.splice(exactIdx,1); return; } // already right where it should be
      const isCheckoutDay = idx === neededDates.length - 1;
      if(movablePool.length){
        const g = movablePool.shift();
        const slot = findFreeGroomSlot(date, isCheckoutDay ? '10:00' : '16:00', 'Bay 3', g.id);
        if(slot){ g.date = date; g.time = slot.time; g.bay = slot.bay; movedCount++; }
        return;
      }
      const slot = findFreeGroomSlot(date, isCheckoutDay ? '10:00' : '16:00', 'Bay 3', null);
      if(!slot) return;
      const record = {
        id: uid('groom'), date, time: slot.time, bay: slot.bay,
        apptTypes: ['FBG'], sizeCode: pet.groomingSize || '', cutCode:'', details:'',
        addons: [], photos: [], status:'Not arrived',
        notes: '(Boarding)',
        customerId: owner.id, petId: pet.id,
      };
      pet.groomingHistory.push(record);
      assignedList.push({ cust: owner, pet, record });
      assignedCount++;
    });
    // Any leftover movablePool entries (more not-done FBGs than the stay now
    // needs, e.g. it was shortened) are left in place rather than auto-deleted
    // — staff can remove them via the usual grooming-history delete if truly
    // no longer wanted.
  });
  return { assignedCount, movedCount, assignedList };
}
/* Shown right after a stay is created if any free groomings were earned —
   lets staff jump straight into editing any of them, one at a time, and land
   back on this same summary after each save (rather than losing the list). */
function openFreeGroomingSummaryModal(assignedList){
  openModal(`
    <div class="modal-head"><h3>Free grooming auto-booked</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;">This stay earned ${assignedList.length} free Basic Grooming (FBG) appointment${assignedList.length===1?'':'s'}. Tap any appointment below to edit its date, time, bay, status, colour, or anything else — you'll come back to this list afterward.</div>
      ${assignedList.map((a,i)=>`
        <div class="today-card" data-fbg-edit="${i}" style="cursor:pointer;">
          <div class="avatar" style="${avatarStyle(a.record.groomColor || colorFor(a.cust.id))}">${initials(a.cust.name)}</div>
          <div class="today-card-main">
            <div class="today-card-pet">${ANIMAL_ICON[a.pet.type]||'🐾'} ${petLabel(a.pet)} <span class="badge badge-active">FBG</span></div>
            <div class="today-card-sub">${fmtDateWithDay(a.record.date)} · ${a.record.time} · ${a.record.bay} · ${GROOM_STATUS_ICON[a.record.status]||''} ${esc(a.record.status||'Not arrived')}</div>
          </div>
          <div style="color:var(--ink-soft);font-size:12px;font-weight:600;">Edit ›</div>
        </div>
      `).join('')}
