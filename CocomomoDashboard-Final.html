/* Staff & leave — migrated to real Postgres tables (17 Aug 2026, migration
   Phase 2, first area) instead of living inside the single JSON blob. This
   proves the "real tables, row-level saves" pattern end-to-end before the
   rest of the app (customers/stays/grooming/etc.) gets the same treatment.
   Requires `staff` and `staff_leaves` tables to exist (see
   phase1-staff-tables.sql) — run that SQL against THIS (live) project
   before this code can work. Old blob's `staff` field is still WRITTEN as
   a redundant backup (snapshotForCloud) but no longer READ from — the
   tables are now the single source of truth. */

/* One-time, safe-to-run-repeatedly: if the staff table is still empty and
   the old blob had staff data, copies it over. Never overwrites existing
   table data, so it can't clobber anything once the tables are the real
   source of truth. */
async function migrateStaffFromBlobIfNeeded(blobStaff){
  if(!blobStaff || !blobStaff.length) return;
  const { count, error } = await sb.from('staff').select('*', {count:'exact', head:true});
  if(error){ console.error('Staff migration check failed:', error); return; }
  if(count > 0) return; // tables already have real data — never overwrite
  for(const s of blobStaff){
    if(!s.name || !s.name.trim()) continue;
    const { data, error: insErr } = await sb.from('staff').insert({ name: s.name }).select().single();
    if(insErr){ console.error('Staff migration insert failed:', insErr); continue; }
    for(const l of (s.leaves||[])){
      if(!l.start || !l.end) continue;
      const { error: leaveErr } = await sb.from('staff_leaves').insert({ staff_id: data.id, start_date: l.start, end_date: l.end, note: l.note||'' });
      if(leaveErr) console.error('Staff-leave migration insert failed:', leaveErr);
    }
  }
}
/* Loads state.staff from the real tables, joined client-side into the same
   {id, name, leaves:[{id,start,end,note}]} shape the rest of the app
   (staffOnLeaveFor, the Staff modal, etc.) already expects — so nothing
   else in the app needs to change. */
async function loadStaffFromTables(){
  const { data: staffRows, error: e1 } = await sb.from('staff').select('*').order('created_at');
  if(e1){ console.error('Staff load failed:', e1); toast('Staff data failed to load from cloud (showing last-known copy): ' + describeSupabaseError(e1)); return; }
  const { data: leaveRows, error: e2 } = await sb.from('staff_leaves').select('*').order('start_date');
  if(e2){ console.error('Staff leaves load failed:', e2); toast('Staff leave data failed to load from cloud (showing last-known copy): ' + describeSupabaseError(e2)); return; }
  state.staff = (staffRows||[]).map(s=>({
    id: s.id, name: s.name,
    leaves: (leaveRows||[]).filter(l=>l.staff_id===s.id).map(l=>({ id:l.id, start:l.start_date, end:l.end_date, note:l.note||'' })),
  }));
}
/* Diffs `original` (staff as loaded from the tables when the modal opened)
   against `working` (staff after the user's edits) and writes only the
   rows that actually changed — inserts for new staff/leaves, updates for
   edited ones, deletes for removed ones — rather than rewriting everything.
   This is the actual thing being proven: a save here costs proportionally
   to what changed, not to the size of the whole dataset. */
async function syncStaffToTables(original, working){
  const origById = new Map(original.map(s=>[s.id, s]));
  const workIds = new Set(working.map(s=>s.id));
  for(const s of original){
    if(!workIds.has(s.id)){
      const { error } = await sb.from('staff').delete().eq('id', s.id); // cascades to staff_leaves
      if(error) throw error;
    }
  }
  for(const s of working){
    const isNewStaff = !origById.has(s.id);
    let realId = s.id;
    if(isNewStaff){
      const { data, error } = await sb.from('staff').insert({ name: s.name }).select().single();
      if(error) throw error;
      realId = data.id;
    } else if(origById.get(s.id).name !== s.name){
      const { error } = await sb.from('staff').update({ name: s.name }).eq('id', s.id);
      if(error) throw error;
    }
    const origLeaves = isNewStaff ? [] : (origById.get(s.id).leaves||[]);
    const origLeaveById = new Map(origLeaves.map(l=>[l.id, l]));
    const workLeaveIds = new Set((s.leaves||[]).map(l=>l.id));
    for(const l of origLeaves){
      if(!workLeaveIds.has(l.id)){
        const { error } = await sb.from('staff_leaves').delete().eq('id', l.id);
        if(error) throw error;
      }
    }
    for(const l of (s.leaves||[])){
      const isNewLeave = !origLeaveById.has(l.id);
      if(isNewLeave){
        const { error } = await sb.from('staff_leaves').insert({ staff_id: realId, start_date: l.start, end_date: l.end, note: l.note||'' });
        if(error) throw error;
      } else {
        const ol = origLeaveById.get(l.id);
        if(ol.start!==l.start || ol.end!==l.end || (ol.note||'')!==(l.note||'')){
          const { error } = await sb.from('staff_leaves').update({ start_date:l.start, end_date:l.end, note:l.note||'' }).eq('id', l.id);
          if(error) throw error;
        }
      }
    }
  }
}
/* Customers & Pets — migrated to real Postgres tables (18 Aug 2026,
   migration Phase 2, second area). Unlike Staff, this data is touched by
   dozens of places throughout the app (bookings, payments, grooming,
   check-in/out, etc.) — rather than rewrite every one of those individually,
   they're left exactly as-is (still mutating state.customers in memory and
   calling scheduleSync() same as before). Instead, the SAVE side is what
   changed: scheduleSync()/saveToCloudNow() now also diffs state.customers
   against `_customersBaseline` (the last-known synced copy) and writes only
   the customer/pet rows that actually changed to these tables, alongside
   the (now smaller) blob save for everything else. `stays` and
   `groomingHistory` stay embedded as jsonb columns on each pet row for
   now — deferred to their own later phases — so a stay/grooming edit still
   rewrites its pet's whole row, but only that one pet's row, not the whole
   dataset. Requires `customers` and `pets` tables to exist with TEXT
   (not uuid) primary keys — see phase2-customers-pets-tables-LIVE.sql —
   ids must be preserved exactly, since things like a shared room's
   "sharing with" list reference another pet's id directly. */

function mapCustomerRow(c){
  return {
    id: c.id, name: c.name || '', ic_passport: c.icPassport || null, phone: c.phone || null,
    gender: c.gender || null, dob: c.dob || null, emergency_name: c.emergencyName || null,
    emergency_phone: c.emergencyPhone || null, customer_types: c.customerTypes || [],
    points_history: c.pointsHistory || [], authorized_pickups: c.authorizedPickups || [],
    agreement: c.agreement || null, agreement_token: c.agreementToken || null,
    color_override: c.colorOverride || null, payments: c.payments || [],
  };
}
function mapPetRow(p, customerId){
  return {
    id: p.id, customer_id: customerId, name: p.name || '', type: p.type || null, breed: p.breed || null,
    colour: p.colour || null, gender: p.gender || null, dob: p.dob || null,
    boarding_size: p.boardingSize || null, grooming_size: p.groomingSize || null, spayed: p.spayed || null,
    last_vax: p.lastVax || null, last_tick: p.lastTick || null, medical: p.medical || null,
    personality: p.personality || null, special: p.special || null, risk_flags: p.riskFlags || [],
    // stays now has its own table (18 Aug 2026, Phase 4) — always send empty
    // here so this column stops carrying duplicate/stale data going forward,
    // and so a stays-only edit doesn't spuriously look like a pet-row change
    // (both the old and new mapped row always show stays: [] either way).
    // stays and groomingHistory now each have their own table (18/23 Aug
    // 2026, Phases 4/5) — always send empty for both here so this column
    // stops carrying duplicate/stale data, and so a stay/grooming-only
    // edit doesn't spuriously look like a pet-row change.
    photo: p.photo || null, stays: [], grooming_history: [],
  };
}
/* One-time, safe-to-run-repeatedly: if the customers table is still empty
   and the old blob had customer data, copies it over in two batch inserts
   (all customers, then all pets) rather than one request per record, since
   there can be 100+ of each. Never overwrites existing table data. */
async function migrateCustomersPetsFromBlobIfNeeded(blobCustomers){
  if(!blobCustomers || !blobCustomers.length) return;
  const { count, error } = await sb.from('customers').select('*', {count:'exact', head:true});
  if(error){ console.error('Customers migration check failed:', error); return; }
  if(count > 0) return; // already migrated — never overwrite
  const custRows = blobCustomers.map(mapCustomerRow);
  const { error: custErr } = await sb.from('customers').insert(custRows);
  if(custErr){ console.error('Customers migration insert failed:', custErr); toast('Customer migration failed — see console. Old data is untouched.'); return; }
  const petRows = [];
  blobCustomers.forEach(c=>(c.pets||[]).forEach(p=>petRows.push(mapPetRow(p, c.id))));
  if(petRows.length){
    const { error: petErr } = await sb.from('pets').insert(petRows);
    if(petErr){ console.error('Pets migration insert failed:', petErr); toast('Pet migration failed — see console. Old data is untouched.'); }
  }
}
/* Loads state.customers from the tables, joined client-side into the same
   nested shape (customer -> pets[]) the rest of the app already expects,
   then normalizes it through the usual normalizeCustomer/normalizePet
   defaults — so nothing else in the app needs to know this changed. Also
   resets `_customersBaseline` to match, so the next save only sends
   whatever changes from here. */
async function loadCustomersPetsFromTables(){
  const { data: custRows, error: e1 } = await sb.from('customers').select('*').order('created_at');
  if(e1){ console.error('Customers load failed:', e1); toast('Customer data failed to load from cloud (showing last-known copy): ' + describeSupabaseError(e1)); return; }
  const { data: petRows, error: e2 } = await sb.from('pets').select('*').order('created_at');
  if(e2){ console.error('Pets load failed:', e2); toast('Pet data failed to load from cloud (showing last-known copy): ' + describeSupabaseError(e2)); return; }
  state.customers = (custRows||[]).map(c=>normalizeCustomer({
    id: c.id, name: c.name, icPassport: c.ic_passport, phone: c.phone, gender: c.gender, dob: c.dob,
    emergencyName: c.emergency_name, emergencyPhone: c.emergency_phone,
    customerTypes: c.customer_types || [], pointsHistory: c.points_history || [],
    authorizedPickups: c.authorized_pickups || [], agreement: c.agreement || null,
    agreementToken: c.agreement_token || null, colorOverride: c.color_override || null,
    payments: c.payments || [],
    pets: (petRows||[]).filter(p=>p.customer_id===c.id).map(p=>({
      id: p.id, name: p.name, type: p.type, breed: p.breed, colour: p.colour, gender: p.gender, dob: p.dob,
      boardingSize: p.boarding_size, groomingSize: p.grooming_size, spayed: p.spayed,
      lastVax: p.last_vax, lastTick: p.last_tick, medical: p.medical, personality: p.personality, special: p.special,
      riskFlags: p.risk_flags || [], photo: p.photo || null,
      stays: p.stays || [], groomingHistory: p.grooming_history || [],
    })),
  }));
  // Deep clone (see the matching fix/comment in attemptSaveWithRetry above) —
  // shallow would let a later in-place mutation of e.g. pet.stays silently
  // "update" this baseline too, breaking the next save's diff.
  _lastSyncedCustomersJSON = JSON.stringify(state.customers);
  _customersBaseline = JSON.parse(_lastSyncedCustomersJSON);
}
/* Diffs `baseline` against `current` and writes only the customer/pet rows
   that actually changed (deep-compared via the same row-mapping functions
   used everywhere else here) — insert/update both go through upsert() on
   the text primary key, which also makes this safe to blindly retry on
   failure without risking a duplicate-key error on the parts that already
   succeeded. Deletes are separate since upsert can't express "remove". */
async function syncCustomersAndPetsToTables(baseline, current){
  const baseById = new Map(baseline.map(c=>[c.id, c]));
  const curIds = new Set(current.map(c=>c.id));
  for(const c of baseline){
    if(!curIds.has(c.id)){
      const { error } = await sb.from('customers').delete().eq('id', c.id); // cascades to pets
      if(error) throw error;
    }
  }
  for(const c of current){
    const old = baseById.get(c.id);
    const custRow = mapCustomerRow(c);
    if(!old || JSON.stringify(mapCustomerRow(old)) !== JSON.stringify(custRow)){
      const { error } = await sb.from('customers').upsert(custRow);
      if(error) throw error;
    }
    const oldPets = old ? (old.pets||[]) : [];
    const oldPetById = new Map(oldPets.map(p=>[p.id, p]));
    const curPetIds = new Set((c.pets||[]).map(p=>p.id));
    for(const p of oldPets){
      if(!curPetIds.has(p.id)){
        const { error } = await sb.from('pets').delete().eq('id', p.id);
        if(error) throw error;
      }
    }
    for(const p of (c.pets||[])){
      const op = oldPetById.get(p.id);
      const petRow = mapPetRow(p, c.id);
      if(!op || JSON.stringify(mapPetRow(op, c.id)) !== JSON.stringify(petRow)){
        const { error } = await sb.from('pets').upsert(petRow);
        if(error) throw error;
      }
    }
  }
}
/* Stays — migrated to a real Postgres table (18 Aug 2026, migration Phase
   4). Same "shared save funnel" approach as Customers/Pets: every one of
   the dozens of places that read/write a pet's `.stays` array (the
   boarding calendar, Today grid, check-in/out, FBG logic, cancellations...)
   is left completely untouched — they keep mutating state.customers in
   memory exactly as before. Only the save/load side changed. Stays are
   flattened out of every pet into one list for diffing/syncing, keyed by
   the stay's own id; `primaryPetId` is whichever pet's `.stays` array a
   stay physically lives in (unchanged concept from before — the "owner"
   pet), `customerId` is that pet's owner, both stored as real columns for
   quick lookups later even though the in-memory shape doesn't use them
   directly. Requires the `stays` table — see phase4-stays-table-LIVE.sql —
   with a TEXT primary key (not uuid), same reasoning as customers/pets:
   a payment's `stayIds` list and the change log both reference a stay's id
   directly, so ids must be preserved exactly during migration. */

function mapStayRow(s, primaryPetId, customerId){
  return {
    id: s.id, primary_pet_id: primaryPetId, customer_id: customerId,
    check_in: s.checkIn, check_out: s.checkOut, status: s.status || 'Active',
    checked_in: !!s.checkedIn, checked_in_pets: s.checkedInPets || [],
    notes: s.notes || null, custom_rate: (s.customRate === '' || s.customRate == null) ? null : +s.customRate,
    custom_rate_mode: s.customRateMode || 'flat', charges: s.charges || [], pets: s.pets || [],
    dropoff: s.dropoff || null, pickup: s.pickup || null, paid_through: s.paidThrough || null,
    reminders_sent: s.remindersSent || {checkin:[],checkout:[]},
  };
}
/* Every stay across every pet, flattened to one list — [{stay, primaryPetId,
   customerId}, ...] — for diffing/syncing as a single unit rather than
   walking the nested customer->pet->stays structure every time. */
function flattenAllStays(customers){
  const out = [];
  customers.forEach(c=>(c.pets||[]).forEach(p=>(p.stays||[]).forEach(stay=>{
    out.push({ stay, primaryPetId: p.id, customerId: c.id });
  })));
  return out;
}
/* One-time, safe-to-run-repeatedly: if the stays table is still empty and
   the just-loaded state.customers has stays embedded in any pet (from the
   old pets.stays jsonb column, the last generation of the Customers/Pets
   migration), copies them into the new table in one batch insert. Must run
   AFTER loadCustomersPetsFromTables() (needs state.customers populated)
   but BEFORE loadStaysFromTables() (which would otherwise overwrite the
   embedded copy with an empty table read before migration has a chance to
   see it). Never overwrites existing table data. */
async function migrateStaysFromPetsColumnIfNeeded(customers){
  const { count, error } = await sb.from('stays').select('*', {count:'exact', head:true});
  if(error){ console.error('Stays migration check failed:', error); return; }
  if(count > 0) return; // already migrated — never overwrite
  const flat = flattenAllStays(customers);
  if(!flat.length) return;
  const rows = flat.map(({stay, primaryPetId, customerId})=>mapStayRow(stay, primaryPetId, customerId));
  const { error: insErr } = await sb.from('stays').insert(rows);
  if(insErr){ console.error('Stays migration insert failed:', insErr); toast('Stays migration failed — see console. Old data is untouched.'); }
}
/* Loads every stay from the table and attaches it back onto the right
   pet's `.stays` array (matched by primary_pet_id) — overwrites whatever
   was there (either the old embedded copy, or nothing) with the
   authoritative table copy, then normalizes each through normalizeStay so
   nothing else in the app needs to know this changed. Also resets
   `_staysBaseline` to match. */
async function loadStaysFromTables(){
  const { data: stayRows, error } = await sb.from('stays').select('*').order('created_at');
  if(error){ console.error('Stays load failed:', error); toast('Stay/booking data failed to load from cloud (showing last-known copy): ' + describeSupabaseError(error)); return; }
  const stayById = {};
  (stayRows||[]).forEach(s=>{
    const stay = normalizeStay({
      id: s.id, checkIn: s.check_in, checkOut: s.check_out, status: s.status,
      checkedIn: s.checked_in, checkedInPets: s.checked_in_pets || [],
      notes: s.notes || '', customRate: s.custom_rate, customRateMode: s.custom_rate_mode || 'flat',
      charges: s.charges || [], pets: s.pets || [], dropoff: s.dropoff || null, pickup: s.pickup || null,
      paidThrough: s.paid_through || null, remindersSent: s.reminders_sent || {checkin:[],checkout:[]},
    });
    (stayById[s.primary_pet_id] = stayById[s.primary_pet_id] || []).push(stay);
  });
  state.customers.forEach(c=>c.pets.forEach(p=>{ p.stays = stayById[p.id] || []; }));
  const flatNow = flattenAllStays(state.customers);
  _lastSyncedStaysJSON = JSON.stringify(flatNow);
  _staysBaseline = JSON.parse(_lastSyncedStaysJSON);
}
/* Diffs `baseline` against `current` (both flattened lists) and writes
   only the stays that actually changed — upsert for new/changed, delete
   for removed. upsert() makes this safe to blindly retry on failure. */
async function syncStaysToTables(baseline, current){
  const baseById = new Map(baseline.map(x=>[x.stay.id, x]));
  const curIds = new Set(current.map(x=>x.stay.id));
  for(const {stay} of baseline){
    if(!curIds.has(stay.id)){
      const { error } = await sb.from('stays').delete().eq('id', stay.id);
      if(error) throw error;
    }
  }
  for(const {stay, primaryPetId, customerId} of current){
    const old = baseById.get(stay.id);
    const row = mapStayRow(stay, primaryPetId, customerId);
    const oldRow = old ? mapStayRow(old.stay, old.primaryPetId, old.customerId) : null;
    if(!oldRow || JSON.stringify(oldRow) !== JSON.stringify(row)){
      const { error } = await sb.from('stays').upsert(row);
      if(error) throw error;
    }
  }
}
/* Grooming — migrated to a real Postgres table (23 Aug 2026, migration

/* Every grooming appointment across every pet, flattened to one list —

async function migrateGroomsFromPetsColumnIfNeeded(customers){
  const { count, error } = await sb.from('grooming_appointments').select('*', {count:'exact', head:true});
  if(error){ console.error('Grooming migration check failed:', error); return; }

}
/* Loads every grooming appointment from the table and attaches it back
   onto the right pet's `.groomingHistory` array (matched by pet_id),
   normalizing each through normalizeGroom. Also resets `_groomsBaseline`. */
async function loadGroomsFromTables(){
  const { data: rows, error } = await sb.from('grooming_appointments').select('*').order('created_at');
  if(error){ console.error('Grooming load failed:', error); toast('Grooming data failed to load from cloud (showing last-known copy): ' + describeSupabaseError(error)); return; }
  const byPet = {};
  (rows||[]).forEach(g=>{
    const groom = normalizeGroom({
      id: g.id, date: g.date, time: g.time || '', bay: g.bay || '', apptTypes: g.appt_types || [],
      sizeCode: g.size_code || '', cutCode: g.cut_code || '', details: g.details || '',
      addons: g.addons || [], photos: g.photos || [], notes: g.notes || '', status: g.status,
      groomColor: g.groom_color || null, reminderSent: !!g.reminder_sent,
      // The rest of the app looks these up directly off the appointment
      // object (e.g. the grooming grid's cust/pet lookup) rather than only
      // relying on which pet's array it's nested in — omitting them here
      // is what caused names to go missing on the grid after this migration.
      customerId: g.customer_id, petId: g.pet_id,
    });
    (byPet[g.pet_id] = byPet[g.pet_id] || []).push(groom);
  });
  state.customers.forEach(c=>c.pets.forEach(p=>{ p.groomingHistory = byPet[p.id] || []; }));
  const flatNow = flattenAllGrooms(state.customers);
  _lastSyncedGroomsJSON = JSON.stringify(flatNow);
  _groomsBaseline = JSON.parse(_lastSyncedGroomsJSON);
}
/* Diffs `baseline` against `current` (both flattened lists) and writes
   only the appointments that actually changed. Same upsert/delete pattern
   as syncStaysToTables — safe to blindly retry. */
async function syncGroomsToTables(baseline, current){
  const baseById = new Map(baseline.map(x=>[x.groom.id, x]));
  const curIds = new Set(current.map(x=>x.groom.id));
  for(const {groom} of baseline){
    if(!curIds.has(groom.id)){
      const { error } = await sb.from('grooming_appointments').delete().eq('id', groom.id);
      if(error) throw error;
    }
  }
  for(const {groom, petId, customerId} of current){
    const old = baseById.get(groom.id);
    const row = mapGroomRow(groom, petId, customerId);
    const oldRow = old ? mapGroomRow(old.groom, old.petId, old.customerId) : null;
    if(!oldRow || JSON.stringify(oldRow) !== JSON.stringify(row)){
      const { error } = await sb.from('grooming_appointments').upsert(row);
      if(error) throw error;
    }
  }
}

/* =========================================================
   BOARDING CALENDAR — rooms × dates, one month at a time
   ========================================================= */
function monthDaysArray(yyyymm){
  const [y,m] = yyyymm.split('-').map(Number);
  const daysInMonth = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const out = [];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const wd = new Date(Date.UTC(y, m-1, d)).toLocaleDateString('en-GB', { weekday:'short', timeZone:'UTC' });
    out.push({ dateStr, dayNum:d, weekday:wd });
  }
  return out;
}
function roomsByType(){
  const groups = [];
  ROOM_INVENTORY.forEach(r=>{
    let g = groups.find(g=>g.type===r.type);
    if(!g){ g = { type:r.type, rooms:[] }; groups.push(g); }
    g.rooms.push(r);
  });
  return groups;
}
/* All bookings touching `roomId` on `dateStr` (check-in day and check-out day both included,
   so same-day room turnover is visible). Returns [] if the room is free that day. */
function cellOccupants(roomId, dateStr){
  const out = [];
  const seenPetIds = new Set();
  state.customers.forEach(cust=>{
    cust.pets.forEach(pet=>{
      pet.stays.forEach(stay=>{
        stay.pets.forEach(sp=>{
          if(sp.room !== roomId) return;
          const memberIds = [sp.petId, ...(sp.sharingWith||[])].filter(Boolean);
          memberIds.forEach(id=>{
            if(seenPetIds.has(id)) return;
            const w = petDatesInStay(stay, sp, id);
            if(dateStr < w.checkIn || dateStr > w.checkOut) return;
            let kind = 'staying';
            if(dateStr === w.checkIn && dateStr === w.checkOut) kind = 'both';
            else if(dateStr === w.checkIn) kind = 'checkin';
            else if(dateStr === w.checkOut) kind = 'checkout';
            // id may be the row's own petId (look up via findPetAcrossStay so a
            // shared stay resolves to the real owner) or a sharing partner's id
            // (look up globally, since they can belong to a different customer).
            const resolved = id===sp.petId ? { pet: findPetAcrossStay(cust, id) || pet, cust } : findPetWithCustomer(id);
            if(!resolved.pet) return;
            seenPetIds.add(id);
            out.push({ cust: resolved.cust || cust, pet: resolved.pet, stay, kind });
          });
        });
      });
    });
  });
  return out;
}

function shiftMonth(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(Date.UTC(y, m-1+delta, 1));
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
}

/* If `pet`'s owner has 2+ pets that each have at least one boarding stay, returns this
   pet's 1-based position among them (stable — based on order in the customer's pet list) —
   so the same pet always gets the same number, letting staff match "owner's pet #2" across
   different rooms/rows. Returns null for single-pet owners (no numbering needed). */
function ownerPetIndex(cust, pet){
  const petsWithStays = cust.pets.filter(p => p.stays && p.stays.length>0);
  if(petsWithStays.length < 2) return null;
  const idx = petsWithStays.findIndex(p=>p.id===pet.id);
  return idx>=0 ? idx+1 : null;
}
/* Label for a same-room, same-day turnover entry: Out / In (not a numbered list). */
function turnoverLabel(kind){
  if(kind==='checkout') return 'O.';
  if(kind==='checkin') return 'I.';
  if(kind==='both') return 'O/I.';
  return '';
}

function calCellHtml(roomId, dateStr, occ, isToday, isHol){
  const holCls = isHol ? 'cal-holiday-col' : '';
  const todayCls = isToday ? 'cal-today-col' : '';
  if(occ.length === 0){
    return `<td class="cal-cell cal-free ${todayCls} ${holCls}" data-cal-cell="${roomId}|${dateStr}"></td>`;
  }
  // distinct owner colours present in this cell
  const colours = [...new Set(occ.map(o=>calendarColorFor(o.cust.id)))];
  const bg = colours.length===1 ? colours[0] : `linear-gradient(to bottom, ${colours[0]} 0%, ${colours[0]} 48%, ${colours[1]} 52%, ${colours[1]} 100%)`;
  const avgLum = colours.reduce((s,c)=>s+relativeLuminance(c),0) / colours.length;
  const textColor = avgLum > 0.45 ? '#1E2B25' : '#FFFFFF';
  const textShadow = textColor === '#FFFFFF' ? '0 1px 1px rgba(0,0,0,.3)' : 'none';
  // Multiple pets in the same room only count as a "turnover" (handoff between
  // different bookings) if they come from different stays. Pets sharing a room
  // within the SAME stay are just sharing — show their names plainly, not O./I.
  const distinctStays = new Set(occ.map(o=>o.stay.id)).size;
  let lines;
  if(distinctStays > 1){
    lines = occ.map(o=>`<div class="cal-cell-line">${turnoverLabel(o.kind)}${esc(o.pet.name)}</div>${o.pet.breed?`<div class="cal-cell-breed">${esc(o.pet.breed)}</div>`:''}`).join('');
  } else if(occ.length > 1){
    lines = occ.map(o=>{
      const idx = ownerPetIndex(o.cust, o.pet);
      return `<div class="cal-cell-line">${idx?`${idx}.`:''}${esc(o.pet.name)}</div>${o.pet.breed?`<div class="cal-cell-breed">${esc(o.pet.breed)}</div>`:''}`;
    }).join('');
  } else {
    const o = occ[0];
    const idx = ownerPetIndex(o.cust, o.pet);
    const arrow = o.kind==='checkin' ? ' →' : o.kind==='checkout' ? ' ←' : o.kind==='both' ? ' ↔' : '';
    lines = `<div class="cal-cell-line">${idx?`${idx}.`:''}${esc(o.pet.name)}${arrow}</div>${o.pet.breed?`<div class="cal-cell-breed">${esc(o.pet.breed)}</div>`:''}`;
  }
  const holBadge = isHol ? '<span class="cal-holiday-badge" title="Holiday rate"></span>' : '';
  return `<td class="cal-cell cal-occupied ${todayCls}" style="background:${bg};color:${textColor};--cal-text-shadow:${textShadow};" data-cal-cell="${roomId}|${dateStr}">${holBadge}${lines}</td>`;
}

          ownerCust.pets.forEach(p=>{ p.stays = p.stays.filter(s=>s.id!==stayId); });
          unlinkPaymentsFromStay(ownerCust, stayId);

  });

    const checkOut = document.getElementById('cb_out').value;
    if(!checkIn || !checkOut || checkOut < checkIn){ toast('Please provide valid check-in/check-out dates'); return; }
    const inClosed = closedDateFor(checkIn);
    const outClosed = closedDateFor(checkOut);
    if(inClosed && !(cbWorkingDropoff.time && cbWorkingDropoff.contactName && cbWorkingDropoff.contactPhone)){
      toast('Check-in falls on a closed day — please fill in the drop-off time and contact details');
      return;
    }
    if(outClosed && !(cbWorkingPickup.time && cbWorkingPickup.contactName && cbWorkingPickup.contactPhone)){
      toast('Check-out falls on a closed day — please fill in the pick-up time and contact details');
      return;
    }
    const room = document.getElementById('cb_room').value;
    if(!room){ toast('Please select a room'); return; }
    for(const [petId, d] of Object.entries(cbSharingDates)){
      if(!d.checkIn || !d.checkOut || d.checkOut < d.checkIn){
        const { pet: badPet } = findPetWithCustomer(petId);
        toast(`${badPet?badPet.name+"'s":'That pet\'s'} own dates in the sharing section aren't valid`);
        return;
      }
    }
    const stayPet = { petId: pet.id, room, sharingWith: cbSharingIds.filter(id=>id!==pet.id), feeding: document.getElementById('cb_feeding').value, belongings:[], dates: cbSharingDates };
    const rowWindow = spRoomWindow({checkIn, checkOut}, stayPet);
    if(!isRoomAvailable(room, rowWindow.checkIn, rowWindow.checkOut, null)){ toast(`${room} is already booked for these dates`); return; }
    if(!confirmIfNearbyStay(pet, checkIn, null)) return;
    const { customRate, customRateMode } = readCustomRate('cb_rate');
    const doSave = ()=>{
      const newStay = {
        id: uid('stay'), checkIn, checkOut, status:'Active', notes:'', customRate, customRateMode, charges:[],
        pets: [stayPet],
        dropoff: inClosed ? {...cbWorkingDropoff} : null,
        pickup: outClosed ? {...cbWorkingPickup} : null,
      };
      pet.stays.push(newStay);
      const petWindows = [pet.id, ...cbSharingIds].map(id=>({ petId:id, ...petDatesInStay(newStay, stayPet, id) }));
      const freeResult = assignFreeGroomings(cust, petWindows);
      closeModal();
      state.calendarMonth = checkIn.slice(0,7);
      renderBoardingCalendar();
      scheduleSync();
      if(freeResult.assignedCount > 0){
        toast(`Booking created — ${freeResult.assignedCount} free grooming${freeResult.assignedCount===1?'':'s'} auto-booked`);
        openFreeGroomingSummaryModal(freeResult.assignedList);
      } else {
        toast('Booking created');
      }
    };
    const holidayHits = holidayOverlapsForStay(checkIn, checkOut);
    if(holidayHits.length){ openHolidayRateNoticeModal(holidayHits, doSave); } else { doSave(); }
  });
}

/* Banner shown above the Grooming availability grid: who's on leave that
   day, and — since staff have to actually be present to groom — an extra
   warning if appointments are already booked but every staff member is on
   leave (nobody would be there to do them). Just a note if leave doesn't
   conflict with anything booked. */
function groomLeaveBannerHtml(date, apptsForDay){
  const onLeave = staffOnLeaveFor(date);
  if(!onLeave.length) return '';
  const totalStaff = (state.staff||[]).length;
  const allOnLeave = totalStaff>0 && onLeave.length>=totalStaff;
  const namesStr = onLeave.map(o=>esc(o.staff.name)).join(', ');
  if(allOnLeave && apptsForDay.length>0){
    return `<div style="background:var(--danger-tint,#FBE4E2);border:1px solid #EEB3AC;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;color:#A23B2C;margin-bottom:12px;">⚠️ ${apptsForDay.length} appointment${apptsForDay.length===1?'':'s'} booked today, but everyone (${namesStr}) is on leave — nobody's scheduled to be here.</div>`;
  }
  return `<div style="background:var(--amber-tint);border:1px solid #F0D2AC;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;color:#8A5A22;margin-bottom:12px;">🚫 On leave today: ${namesStr}</div>`;
}

function allGroomAppointmentsOn(date){
  const out = [];
  state.customers.forEach(c=> c.pets.forEach(p=> p.groomingHistory.forEach(g=>{
    if(g.date===date) out.push(g);
  })));
  return out;
}

function gridRowHtml(time, date, apptsForDay){
  return `<tr>
    <td class="time-cell">${time}</td>
    ${BAYS.map(bay=>{
      const appt = apptsForDay.find(a=>a.time===time && a.bay===bay);
      if(!appt){
        return `<td class="slot-cell slot-free" data-time="${time}" data-bay="${bay}"></td>`;
      }
      const cust = getCustomer(appt.customerId);
      const pet = cust ? getPet(cust, appt.petId) : null;
      const color = appt.groomColor || (cust ? colorFor(cust.id) : 'var(--teal)');
      const textColor = textColorFor(color);
      const textShadow = textColor === '#FFFFFF' ? '0 1px 1px rgba(0,0,0,.3)' : 'none';
      const hasNotes = !!(appt.notes && appt.notes.trim());
      const apptStatus = appt.status || 'Not arrived';
      const dimmed = state.groomStatusFilter && state.groomStatusFilter !== apptStatus;
      return `<td class="slot-cell slot-booked slot-status-${apptStatus.replace(/[^a-z]/gi,'')} ${dimmed?'slot-dimmed':''}" style="background:${color};color:${textColor};--cal-text-shadow:${textShadow};" data-groomid="${appt.id}">        ${hasNotes ? `<span class="slot-note-badge" title="Has notes — click to view">📝</span>` : ''}

        <div class="slot-apt-type">${esc((appt.apptTypes||[]).join(', ')||'—')}</div>
        <div class="slot-status-label">${GROOM_STATUS_ICON[apptStatus]||''} ${esc(apptStatus)}</div>
      </td>`;
    }).join('')}
  </tr>`;
}

function openFullBookingModal(prefTime, prefBay){
  if(state.customers.length===0){ toast('Add a customer first'); return; }
  const initialDate = state.groomingDate;
  const initialTime = prefTime || TIME_SLOTS[0];
  openModal(`
    <div class="modal-head"><h3>Book appointment</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div class="form-grid c3">
        <div class="field span3">
          <label>Search by customer or pet name</label>
          <input id="b_cust_search" placeholder="Start typing a name…" autocomplete="off">
        </div>
        <div class="field"><label>Customer</label><select id="b_cust"></select></div>
        <div class="field span2"><label>Pet</label><select id="b_pet"></select></div>
        <div class="field"><label>Date</label><div class="date-overlay-wrap"><input type="date" id="b_date" value="${initialDate}"><span class="date-overlay-label" id="b_date_day"></span></div></div>
        <div class="field"><label>Time</label>
          <select id="b_time">${TIME_SLOTS.map(t=>`<option ${t===initialTime?'selected':''}>${t}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Bay</label>
          <select id="b_bay">${bayOptionsHtml(initialDate, initialTime, prefBay, null)}</select>
        </div>
        ${multiSelectFieldHtml('b_apt', 'Appointment type', APPT_TYPES)}
        <div class="field"><label>Size</label><input id="b_size" placeholder="e.g. Small"></div>
        <div class="field span2"><label>Cut code</label><input id="b_cutcode" placeholder="e.g. 8 inch blade, teddy bear face"></div>
        <div class="field span3"><label>Grooming details</label><textarea id="b_details"></textarea></div>
        ${multiSelectFieldHtml('b_addon', 'Add-on services', ADDONS)}
        <div class="field span3"><label>Notes</label><textarea id="b_notes"></textarea></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Book appointment</button>
    </div>
  `, {wide:true});
  const getBTypes = wireMultiSelectEditor('b_apt', APPT_TYPES, []);
  const getBAddons = wireMultiSelectEditor('b_addon', ADDONS, []);
  let lastAutoSize = ''; // tracks what we last auto-filled, so we don't clobber a size the staff typed themselves
  function applyGroomingSizeDefault(){
    const cust = getCustomer(document.getElementById('b_cust').value);
    const pet = cust ? getPet(cust, document.getElementById('b_pet').value) : null;
    const sizeEl = document.getElementById('b_size');
    if(!pet || !pet.groomingSize) return;
    if(sizeEl.value === '' || sizeEl.value === lastAutoSize){
      sizeEl.value = pet.groomingSize;
      lastAutoSize = pet.groomingSize;
    }
  }
  function refreshPetOptions(query){
    const cust = getCustomer(document.getElementById('b_cust').value);
    document.getElementById('b_pet').innerHTML = cust ? (cust.pets.map(p=>`<option value="${p.id}">${ANIMAL_ICON[p.type]} ${petLabel(p)}</option>`).join('') || '<option value="">No pets</option>') : '<option value="">No pets</option>';
    if(cust && query){
      const matchedPet = cust.pets.find(p=>p.name.toLowerCase().includes(query));
      if(matchedPet) document.getElementById('b_pet').value = matchedPet.id;
    }
    checkBoardingTag();
    applyGroomingSizeDefault();
  }
  function checkBoardingTag(){
    const cust = getCustomer(document.getElementById('b_cust').value);
    const pet = cust ? getPet(cust, document.getElementById('b_pet').value) : null;
    const date = document.getElementById('b_date').value;
    applyBoardingNoteTag(document.getElementById('b_notes'), isPetBoardingOnDate(pet, date));
  }
  function refreshCustOptions(filterText){
    const q = filterText.trim().toLowerCase();
    const filtered = state.customers
      .filter(c => !q || c.name.toLowerCase().includes(q) || c.pets.some(p=>p.name.toLowerCase().includes(q)))
      .slice().sort((a,b)=> a.name.localeCompare(b.name));
    const sel = document.getElementById('b_cust');
    const prevVal = sel.value;
    sel.innerHTML = filtered.length
      ? filtered.map(c=>`<option value="${c.id}">${esc(c.name)}${c.pets.length?` (${c.pets.map(p=>esc(p.name)).join(', ')})`:''}</option>`).join('')
      : '<option value="">No matching customers</option>';
    if(filtered.some(c=>c.id===prevVal)) sel.value = prevVal;
    refreshPetOptions(q);
  }
  function refreshBBay(){
    const bayEl = document.getElementById('b_bay');
    const cur = bayEl.value;
    bayEl.innerHTML = bayOptionsHtml(document.getElementById('b_date').value, document.getElementById('b_time').value, cur, null);
  }
  function refreshBDateDay(){
    document.getElementById('b_date_day').textContent = fmtDateSlashDay(document.getElementById('b_date').value);
  }
  document.getElementById('b_cust_search').addEventListener('input', (e)=>refreshCustOptions(e.target.value));
  document.getElementById('b_cust').addEventListener('change', ()=>refreshPetOptions(document.getElementById('b_cust_search').value.trim().toLowerCase()));
  document.getElementById('b_pet').addEventListener('change', checkBoardingTag);
  document.getElementById('b_pet').addEventListener('change', applyGroomingSizeDefault);
  document.getElementById('b_date').addEventListener('change', refreshBBay);
  document.getElementById('b_date').addEventListener('change', checkBoardingTag);
  document.getElementById('b_date').addEventListener('change', refreshBDateDay);
  document.getElementById('b_time').addEventListener('change', refreshBBay);
  refreshBDateDay();
  refreshCustOptions('');
  document.getElementById('b_cust_search').focus();
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', ()=>{
    const cust = getCustomer(document.getElementById('b_cust').value);
    const pet = cust ? getPet(cust, document.getElementById('b_pet').value) : null;
    if(!cust || !pet){ toast('Please pick a customer with a pet'); return; }
    const date = document.getElementById('b_date').value;
    const time = document.getElementById('b_time').value;
    const bay = document.getElementById('b_bay').value;
    const apptTypes = getBTypes();
    if(apptTypes.length===0){ toast('Please pick at least one appointment type'); return; }
    if(isClosedDate(date)){ toast('Shop is closed on that date — no grooming appointments can be taken'); return; }
    if(findGroomConflict(date,time,bay,null)){ toast(`${bay} is already booked at ${time} on that date`); return; }
    if(!confirmIfNearbyGroom(pet, date, null)) return;
    const addons = getBAddons();
    pet.groomingHistory.push({
      id:uid('groom'), date, time, bay, apptTypes,
      sizeCode:document.getElementById('b_size').value, cutCode:document.getElementById('b_cutcode').value, details:document.getElementById('b_details').value,
      addons, photos:[], status:'Not arrived', notes:document.getElementById('b_notes').value, customerId:cust.id, petId:pet.id,
    });
    closeModal(); state.groomingDate = date; renderGroomingAvailability(); toast('Appointment booked');
  });
}

document.getElementById('backupBtn').addEventListener('click', ()=>{
  // Customers/pets moved out of snapshotForCloud() (18 Aug 2026 migration) —
  // it's no longer part of what's pushed to the blob table, since it lives
  // in its own tables now. A backup file still needs to be a COMPLETE,
  // standalone snapshot for disaster recovery, so it's added back in here.
  const snapshot = { ...snapshotForCloud(), customers: state.customers };
  const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url;
  a.download = `cocomomo-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
});

if(APP_PIN){
  const lockScreen = document.getElementById('lockScreen');
  const lockInput = document.getElementById('lockInput');
  const lockError = document.getElementById('lockError');
  // Stay unlocked across page refreshes within the same browser tab/session —
  // only ask again once the tab/browser is actually closed (sessionStorage
  // clears then). Tied to the current PIN value, so changing the PIN later
  // still forces everyone to re-enter it once.
  let alreadyUnlocked = false;
  try{ alreadyUnlocked = sessionStorage.getItem('pawSalonUnlockedFor') === APP_PIN; }catch(err){ /* storage unavailable — just ask for the PIN */ }
  if(alreadyUnlocked){
    lockScreen.remove();
    initApp();
  } else {
    lockScreen.classList.remove('hidden');
    lockInput.focus();
    function tryUnlock(){
      if(lockInput.value === APP_PIN){
        try{ sessionStorage.setItem('pawSalonUnlockedFor', APP_PIN); }catch(err){ /* ignore — just won't persist across refresh */ }
        lockScreen.remove();
        initApp();
      } else {
        lockError.classList.remove('hidden');
        lockInput.value = '';
        lockInput.focus();
      }
    }
    document.getElementById('lockSubmit').addEventListener('click', tryUnlock);
    lockInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryUnlock(); });
  }
} else {
  initApp();
}
</script>
</body>
</html>
