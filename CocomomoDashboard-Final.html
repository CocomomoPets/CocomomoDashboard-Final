<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=0.5, minimum-scale=0.3, maximum-scale=3.0, user-scalable=yes">
<title>Cocomomo okr</title>
<style>
  :root{
    --bg: #F6F4EF;
    --panel: #FFFFFF;
    --panel-2: #FBFAF7;
    --ink: #1E2B25;
    --ink-soft: #58685F;
    --line: #E1DCCF;
    --line-soft: #ECE8DD;
    --teal: #1B5EAC;
    --teal-dark: #144A87;
    --teal-tint: #E3ECF8;
    --amber: #E0873C;
    --amber-tint: #FBE9D6;
    --danger: #C05B4D;
    --ok: #3B7A57;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(30,43,37,.06), 0 6px 20px -8px rgba(30,43,37,.12);
    --font-display: 'Fraunces', Georgia, serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  *{box-sizing:border-box;}
  html,body{height:100%; overflow-x:hidden;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',var(--font-ui); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
    width:100%; max-width:100vw;
  }
  ::selection{background:var(--amber-tint);}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:13.5px;}
  a{color:inherit;}
  .app{ display:flex; flex-direction:column; height:100vh; max-width:100vw; overflow-x:hidden; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:18px;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:var(--panel);
    flex-shrink:0;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:4px;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  #shopName{
    font-family:var(--font-display); font-weight:600; font-size:20px;
    border:1px solid transparent; background:transparent; color:var(--ink);
    padding:3px 8px; border-radius:6px; min-width:120px;
  }
  #shopName:hover{ border-color:var(--line); }
  #shopName:focus{ outline:none; border-color:var(--teal); background:var(--teal-tint); }
  .tabs{ display:flex; gap:4px; margin-left:8px; }
  .tab-btn{
    border:none; background:transparent; padding:9px 16px; border-radius:8px;
    font-weight:600; font-size:13.5px; color:var(--ink-soft); letter-spacing:.1px;
  }
  .tab-btn.active{ background:var(--teal); color:#fff; }
  .tab-btn:not(.active):hover{ background:var(--line-soft); color:var(--ink); }
  .topbar-spacer{flex:1;}
  .btn{
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--teal); color:var(--teal-dark); }
  .btn-primary{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn-primary:hover{ background:var(--teal-dark); border-color:var(--teal-dark); color:#fff; }
  .btn-amber{ background:var(--amber); border-color:var(--amber); color:#fff; }
  .btn-amber:hover{ filter:brightness(.94); }
  .btn-ghost{ border-color:transparent; background:transparent; }
  .btn-ghost:hover{ background:var(--line-soft); }
  .btn-sm{ padding:5px 10px; font-size:12px; border-radius:6px; }
  .btn-danger{ color:var(--danger); border-color:#EBD3CE; }
  .btn-danger:hover{ background:#FBEEEB; border-color:var(--danger); }

  .sync-status{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ink-soft); padding:6px 10px; border-radius:99px; border:1px solid var(--line); background:var(--panel-2); }
  .sync-dot{ width:8px; height:8px; border-radius:50%; background:#B9B2A0; flex-shrink:0; }
  .sync-status.sync-ok .sync-dot{ background:var(--ok); box-shadow:0 0 0 3px #E3F1E8; }
  .sync-status.sync-ok{ color:var(--teal-dark); border-color:#CFE6DC; }
  .sync-status.sync-saving .sync-dot{ background:var(--amber); animation:pulse 1s infinite; }
  .sync-status.sync-saving{ color:#8A5A22; border-color:#F0D2AC; }
  .sync-status.sync-error .sync-dot{ background:var(--danger); }
  .sync-status.sync-error{ color:var(--danger); border-color:#EBD3CE; }
  .sync-status.sync-off{ cursor:pointer; }
  .sync-status.sync-off:hover{ border-color:var(--teal); color:var(--teal-dark); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .lock-screen{
    position:fixed; inset:0; z-index:500; background:#1B5EAC;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:22px;
  }
  .lock-screen-banner{ width:100%; max-width:340px; height:auto; display:block; }
  .lock-card{
    background:var(--panel); border-radius:14px; padding:34px 30px; width:100%; max-width:340px;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .lock-card .brand-mark{ margin:0 auto 16px; width:44px; height:44px; }
  .lock-card h2{ font-family:var(--font-display); font-size:18px; margin:0 0 6px; }
  .lock-card p{ color:var(--ink-soft); font-size:12.5px; margin:0 0 18px; }
  .lock-card input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2);
    font-size:16px; text-align:center; letter-spacing:3px; margin-bottom:10px;
  }
  .lock-card input:focus{ outline:none; border-color:var(--teal); background:#fff; }
  .lock-card .btn{ width:100%; justify-content:center; padding:11px; }
  .lock-error{ color:var(--danger); font-size:12px; font-weight:600; margin:-4px 0 12px; }

  /* ---------- Body layout ---------- */
  .body{ flex:1; display:flex; min-height:0; min-width:0; overflow-x:hidden; }
  .sidebar{
    width:290px; flex-shrink:0; border-right:1px solid var(--line);
    background:var(--panel); display:flex; flex-direction:column; min-height:0;
  }
  .sidebar-head{ padding:14px 14px 10px; border-bottom:1px solid var(--line-soft); }
  .search-box{ position:relative; }
  .search-box input{
    width:100%; padding:8px 10px 8px 30px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2);
  }
  .search-box input:focus{ outline:none; border-color:var(--teal); }
  .search-box svg{ position:absolute; left:9px; top:9px; width:14px; height:14px; stroke:var(--ink-soft); fill:none; stroke-width:2; }
  .sidebar-actions{ display:flex; gap:6px; margin-top:10px; }
  .sidebar-actions .btn{ flex:1; justify-content:center; padding:7px 8px; }
  .customer-list{ flex:1; overflow-y:auto; padding:6px; }
  .customer-item{
    display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:8px;
    margin-bottom:2px; position:relative;
  }
  .customer-item:hover{ background:var(--line-soft); }
  .customer-item.active{ background:var(--teal-tint); }
  .avatar{
    width:34px; height:34px; border-radius:50%; flex-shrink:0; color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
  }
  .cust-meta{ min-width:0; flex:1; }
  .cust-name{ font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cust-sub{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .active-dot{ width:8px; height:8px; border-radius:50%; background:var(--ok); flex-shrink:0; box-shadow:0 0 0 3px #E3F1E8; }
  .empty-side{ padding:30px 16px; text-align:center; color:var(--ink-soft); font-size:13px; }

  .main{ flex:1; min-width:0; max-width:100%; overflow-y:auto; overflow-x:hidden; padding:22px 28px 60px; }
  .placeholder{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--ink-soft); gap:8px; text-align:center;
  }
  .placeholder svg{width:46px;height:46px;stroke:var(--line);fill:none;stroke-width:1.4;}
  .placeholder b{ color:var(--ink); font-family:var(--font-display); font-size:18px; font-weight:600; }

  /* ---------- Customer detail ---------- */
  .cust-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .cust-card-top{ display:flex; align-items:flex-start; gap:14px; }
  .cust-card-top .avatar{ width:52px; height:52px; font-size:18px; }
  .cust-card-name{ font-family:var(--font-display); font-size:22px; font-weight:600; }
  .cust-card-id{ color:var(--ink-soft); font-size:12.5px; font-family:var(--font-mono); }
  .cust-type-chips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .type-chip{ background:var(--teal-tint); color:var(--teal-dark); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:99px; letter-spacing:.2px; }
  .type-chip-membership{ background:var(--amber-tint); color:#8A5A22; }
  .sidebar-membership-badge{ font-size:9.5px; font-weight:800; letter-spacing:.3px; padding:1px 6px; border-radius:99px; background:var(--amber-tint); color:#8A5A22; flex-shrink:0; }

  .payments-section{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft); }
  .payments-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .payments-title{ font-family:var(--font-display); font-weight:600; font-size:14px; }
  .payments-total{ font-size:12.5px; font-weight:700; color:var(--teal-dark); background:var(--teal-tint); padding:2px 10px; border-radius:99px; }
  .payments-head #addPaymentBtn{ margin-left:auto; }
  .payment-row{ display:flex; align-items:center; gap:12px; padding:8px 10px; border:1px solid var(--line-soft); border-radius:8px; margin-bottom:6px; background:var(--panel-2); flex-wrap:wrap; }
  .payment-amount{ font-weight:700; font-size:13px; font-family:var(--font-mono); }
  .payment-receipt{ font-size:11.5px; font-family:var(--font-mono); color:var(--teal-dark); background:var(--teal-tint); padding:2px 8px; border-radius:99px; }
  .payment-stay-tag{ font-size:11.5px; color:var(--ink-soft); background:#fff; border:1px solid var(--line); padding:2px 8px; border-radius:99px; }
  .payment-date{ font-size:12px; color:var(--ink-soft); margin-left:auto; }
  .agreement-section{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft); }
  .points-section{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line-soft); }
  .points-balance-badge{ font-size:13px; font-weight:800; color:#8A5A22; background:var(--amber-tint); padding:3px 12px; border-radius:99px; }
  .policy-text-box{ max-height:220px; overflow-y:auto; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:12.5px; white-space:pre-wrap; line-height:1.55; margin-bottom:14px; }
  .sig-pad-wrap{ border:1px solid var(--line); border-radius:8px; background:#fff; touch-action:none; }
  .sig-pad-wrap canvas{ display:block; width:100%; height:150px; cursor:crosshair; }
  .cust-card-actions{ margin-left:auto; display:flex; gap:6px; }
  .info-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px 22px; margin-top:16px; }
  .info-field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); font-weight:600; margin-bottom:3px; }
  .info-field div{ font-size:13.5px; }

  .pet-tabs{ display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px; }
  .pet-tab{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:9px;
    border:1px solid var(--line); background:var(--panel); flex-shrink:0;
  }
  .pet-tab.active{ border-color:var(--teal); background:var(--teal-tint); }
  .pet-tab .pt-icon{ font-size:15px; }
  .pet-tab-thumb{ width:18px; height:18px; border-radius:50%; object-fit:cover; flex-shrink:0; }
  .pet-photo-box{ width:64px; height:64px; border-radius:12px; overflow:hidden; flex-shrink:0; background:var(--panel-2); border:1px solid var(--line); }
  .pet-photo-img{ width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .pet-photo-placeholder{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:28px; }
  .pet-tab-add{ border-style:dashed; color:var(--ink-soft); font-weight:600; }

  .subtabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .subtab-btn{
    border:none; background:transparent; padding:9px 4px; margin-right:22px; font-weight:600;
    font-size:13px; color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .subtab-btn.active{ color:var(--teal-dark); border-bottom-color:var(--teal); }

  .section-title{ font-family:var(--font-display); font-size:15.5px; font-weight:600; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .history-group-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin:16px 0 8px; }
  .history-group-label:first-of-type{ margin-top:0; }
  .badge{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:99px; font-size:11px; font-weight:700; letter-spacing:.2px; }
  .badge-active{ background:var(--teal-tint); color:var(--teal-dark); }
  .badge-past{ background:var(--line-soft); color:var(--ink-soft); }

  .stay-card, .groom-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden;
  }
  .card-head{ display:flex; align-items:center; gap:12px; padding:13px 16px; cursor:pointer; }
  .card-head:hover{ background:var(--panel-2); }
  .card-head .chev{ transition:transform .15s; color:var(--ink-soft); flex-shrink:0; }
  .card-head.open .chev{ transform:rotate(90deg); }
  .card-head-title{ font-weight:700; font-size:13.5px; }
  .card-head-sub{ font-size:12px; color:var(--ink-soft); }
  .card-head-actions{ margin-left:auto; display:flex; gap:6px; }
  .card-body{ padding:0 16px 16px; border-top:1px solid var(--line-soft); }
  .card-body.closed{ display:none; }

  .stay-pet-block{ background:var(--panel-2); border:1px solid var(--line-soft); border-radius:8px; padding:12px 14px; margin-top:12px; }
  .stay-pet-block h4{ margin:0 0 8px; font-size:13px; display:flex; align-items:center; gap:8px; }

  .today-date-section{ margin-bottom:28px; padding-bottom:22px; border-bottom:1px solid var(--line-soft); }
  .today-date-section:last-child{ border-bottom:none; margin-bottom:0; }
  .today-date-heading{ display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
  .today-date-section.primary .today-date-label{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--ink); }
  .today-date-section.muted .today-date-label{ font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--ink-soft); }
  .today-date-sub{ font-size:12px; color:var(--ink-soft); }
  .today-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:20px; align-items:start; }
  .today-col-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .today-col-head h2{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:0; }
  .today-count{ background:var(--teal-tint); color:var(--teal-dark); font-weight:700; font-size:12px; padding:2px 9px; border-radius:99px; }
  .today-card{
    display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer;
  }
  .today-card:hover{ border-color:var(--teal); }
  .today-card-confirmed{ background:#FFFDE7; border-color:#F5EBB0; }
  .today-card-confirmed:hover{ border-color:#E0C94A; }
  .today-card .avatar{ width:38px; height:38px; font-size:13px; flex-shrink:0; }
  .today-card-main{ min-width:0; flex:1; }
  .today-card-pet{ font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:6px; }
  .today-card-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .today-card-room{ font-family:var(--font-mono); font-size:11.5px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; flex-shrink:0; }
  .today-empty{ color:var(--ink-soft); font-size:13px; padding:20px 4px; border:1px dashed var(--line); border-radius:10px; text-align:center; }
  .kv-row{ display:grid; grid-template-columns:130px 1fr; gap:6px; font-size:12.5px; margin-bottom:5px; }
  .kv-row span:first-child{ color:var(--ink-soft); font-weight:600; }
  .belonging-list{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .belonging-chip{ display:flex; align-items:center; gap:5px; background:#fff; border:1px solid var(--line); border-radius:7px; padding:4px 8px; font-size:11.5px; }
  .belonging-photo{ width:18px; height:18px; border-radius:4px; object-fit:cover; cursor:zoom-in; flex-shrink:0; }
  .belonging-cam{ border:none; background:transparent; padding:0; font-size:13px; line-height:1; cursor:pointer; flex-shrink:0; }
  .belonging-x{ border:none; background:none; color:var(--danger); cursor:pointer; font-weight:700; font-size:11px; padding:0 0 0 2px; }
  .charges-section{ margin-top:14px; }
  .charges-list{ margin-top:6px; }
  .charge-row{ display:flex; align-items:center; gap:10px; padding:6px 10px; border:1px solid var(--line-soft); border-radius:7px; margin-bottom:5px; background:#fff; flex-wrap:wrap; }
  .charge-cat-badge{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; color:var(--teal-dark); background:var(--teal-tint); padding:2px 8px; border-radius:99px; flex-shrink:0; }
  .charge-desc{ font-size:12.5px; flex:1; min-width:80px; }
  .charge-qty{ font-size:12px; color:var(--ink-soft); font-family:var(--font-mono); }
  .charge-qty-edit{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-soft); font-weight:600; }
  .charge-qty-edit input{ width:48px; padding:3px 5px; border:1px solid var(--line); border-radius:5px; font-size:12px; }
  .charge-amount{ font-weight:700; font-size:12.5px; font-family:var(--font-mono); }
  .charge-add-row{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .charge-add-row select{ flex:0 0 140px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; }
  .charge-add-row input[data-charge-desc]{ flex:1; min-width:120px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; }
  .charge-add-row input[data-charge-newqty]{ flex:0 0 64px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; }
  .charge-add-row input[data-charge-amount]{ flex:0 0 90px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; }
  .cost-box{ margin-top:12px; background:var(--amber-tint); border:1px solid #F0D2AC; border-radius:8px; padding:10px 14px; font-size:12.5px; }
  .cost-box .cost-total{ font-weight:700; font-size:15px; color:var(--teal-dark); }
  .cost-box .cost-paid{ margin-top:6px; padding-top:6px; border-top:1px dashed #E4C48C; font-weight:600; color:var(--ink-soft); }
  .cost-box .cost-outstanding{ font-weight:700; font-size:14px; color:var(--danger); }
  .cost-box .cost-outstanding.cost-outstanding-clear{ color:var(--ok); }

  .photo-thumb{ width:40px; height:40px; border-radius:6px; object-fit:cover; border:1px solid var(--line); display:block; cursor:zoom-in; }
  .photo-thumb-wrap{ position:relative; }
  .photo-remove{
    position:absolute; top:-6px; right:-6px; width:17px; height:17px; border-radius:50%; border:none;
    background:var(--danger); color:#fff; font-size:10px; line-height:1; display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  .lightbox-backdrop{ position:fixed; inset:0; background:rgba(20,26,23,.85); z-index:300; display:flex; align-items:center; justify-content:center; padding:30px; }
  .lightbox-backdrop img{ max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .lightbox-close{ position:absolute; top:18px; right:22px; width:34px; height:34px; border-radius:50%; border:none; background:rgba(255,255,255,.15); color:#fff; font-size:16px; }
  .lightbox-close:hover{ background:rgba(255,255,255,.28); }
  .photo-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }

  /* ---------- Grooming availability grid ---------- */
  .avail-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .date-nav{ display:flex; align-items:center; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:4px; }
  .date-nav button{ border:none; background:transparent; width:34px; height:34px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; z-index:1; }
  .date-nav button svg{ pointer-events:none; }
  .date-nav button:hover{ background:var(--line-soft); }
  .date-nav input[type=date]{ border:none; background:transparent; padding:5px 6px; font-weight:600; font-size:13px; width:128px; flex-shrink:0; box-sizing:border-box; }
  .legend-row{ display:flex; gap:16px; margin-left:auto; font-size:12.5px; color:var(--ink-soft); align-items:center; flex-wrap:wrap; }
  .legend-chip{ display:flex; align-items:center; gap:6px; }
  .legend-swatch{ width:11px; height:11px; border-radius:3px; }

  .grid-wrap{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:auto; box-shadow:var(--shadow); width:100%; max-width:100%; -webkit-overflow-scrolling:touch; }

  .cal-wrap{ max-height:74vh; width:100%; max-width:100%; -webkit-overflow-scrolling:touch; }
  table.cal-grid{ border-collapse:collapse; width:100%; }
  table.cal-grid th, table.cal-grid td{ border:1px solid var(--line-soft); }
  table.cal-grid thead th{
    background:var(--panel-2); position:sticky; top:0; z-index:3; padding:9px 6px;
    font-size:19px; font-weight:700; color:var(--ink-soft); text-align:center; white-space:nowrap; min-width:92px;
  }
  table.cal-grid thead th.cal-room-head{ left:0; z-index:4; text-align:left; padding:9px 12px; min-width:auto; }
  table.cal-grid thead .cal-wd{ display:block; font-size:16px; font-weight:600; text-transform:uppercase; color:var(--ink-soft); opacity:.8; }
  .cal-type-row td{
    background:var(--teal-tint); color:var(--teal-dark); font-weight:700; font-size:19px;
    padding:7px 12px; position:sticky; left:0; text-align:left;
  }
  .cal-room-cell{
    position:sticky; left:0; background:var(--panel-2); z-index:1; font-family:var(--font-mono);
    font-size:20px; font-weight:700; padding:0 12px; white-space:nowrap; text-align:left;
  }
  .cal-cell{ width:92px; height:56px; padding:3px 6px; vertical-align:top; cursor:pointer; position:relative; }
  .cal-free:hover{ background:var(--teal-tint); }
  .cal-occupied{ color:#fff; }
  .cal-occupied:hover{ filter:brightness(.95); }
  .cal-cell-line{ font-size:12.5px; font-weight:700; line-height:1.28; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:var(--cal-text-shadow, 0 1px 1px rgba(0,0,0,.3)); max-width:80px; }
  .cal-cell-breed{ font-size:11px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.9; text-shadow:var(--cal-text-shadow, 0 1px 1px rgba(0,0,0,.3)); max-width:80px; }
  .cal-today-col{ box-shadow:inset 0 0 0 2px var(--amber); }
  th.cal-holiday-col{ background:var(--amber-tint) !important; color:#8A5A22; }
  td.cal-free.cal-holiday-col{ background:var(--amber-tint); }
  td.cal-free.cal-holiday-col:hover{ background:#F5DFB8; }
  .cal-staffleave-mark{ display:block; font-size:10px; font-weight:700; color:#A23B2C; margin-top:1px; cursor:help; }
  .cal-holiday-badge{ position:absolute; top:3px; right:4px; width:7px; height:7px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 1.5px rgba(255,255,255,.9); }
  .colour-swatch-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .colour-swatch{ width:26px; height:26px; border-radius:7px; border:2px solid transparent; cursor:pointer; padding:0; }
  .colour-swatch:hover{ transform:scale(1.08); }
  .colour-swatch-active{ border-color:var(--ink); box-shadow:0 0 0 2px #fff inset; }
  .colour-swatch-auto{ background:var(--panel-2); border:1.5px dashed var(--line); color:var(--ink-soft); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .colour-swatch-auto.colour-swatch-active{ border-style:solid; border-color:var(--teal); color:var(--teal-dark); }
  table.avail-grid{ border-collapse:collapse; width:100%; min-width:640px; }
  table.avail-grid th, table.avail-grid td{ border:1px solid var(--line-soft); }
  table.avail-grid thead th{
    background:var(--panel-2); position:sticky; top:0; z-index:2; padding:10px 8px;
    font-size:18px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); font-weight:700;
  }
  table.avail-grid thead th:first-child{ left:0; z-index:3; }
  .time-cell{
    position:sticky; left:0; background:var(--panel-2); z-index:1; padding:0 12px;
    font-family:var(--font-mono); font-size:23px; font-weight:600; color:var(--ink-soft);
    white-space:nowrap; text-align:right; width:96px;
  }
  .slot-cell{ height:64px; width:170px; padding:0; vertical-align:top; position:relative; }
  .slot-note-badge{ position:absolute; top:3px; right:5px; font-size:12px; line-height:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .slot-free{ cursor:pointer; }
  .slot-free:hover{ background:var(--teal-tint); }
  .slot-booked{ cursor:pointer; padding:6px 8px; color:#fff; }
  .slot-booked:hover{ filter:brightness(.95); }
  .slot-apt-type{ font-weight:600; font-size:12.5px; line-height:1.25; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
  .slot-pet-name{ font-size:12.5px; font-weight:700; opacity:.95; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
  .slot-breed-inline{ font-weight:500; opacity:.85; }
  .slot-status-label{ font-size:10.5px; font-weight:700; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; margin-top:1px; }
  /* Left colour stripe per grooming status, so staff can scan the whole grid
     at a glance without opening each slot — amber while in progress, green
     once done & the owner's been told, dim once picked up. */
  .slot-status-Notarrived{ box-shadow: inset 4px 0 0 rgba(255,255,255,.5); }
  .slot-status-Inprogress{ box-shadow: inset 4px 0 0 #FFC93C; }
  .slot-status-Doneinformed{ box-shadow: inset 4px 0 0 #35D07F; }
  .slot-status-Pickedup{ box-shadow: inset 4px 0 0 rgba(255,255,255,.2); }
  .slot-dimmed{ opacity:.28; filter:grayscale(.4); }
  .status-filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .status-filter-chip{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
    padding:6px 12px; border-radius:99px; border:1px solid var(--line); background:#fff;
    color:var(--ink-soft); cursor:pointer; transition:all .12s;
  }
  .status-filter-chip:hover{ border-color:var(--teal); color:var(--teal-dark); }
  .status-filter-chip.active{ background:var(--teal-dark); border-color:var(--teal-dark); color:#fff; }
  .status-filter-count{
    background:rgba(0,0,0,.08); border-radius:99px; padding:1px 7px; font-family:var(--font-mono); font-size:11.5px;
  }
  .status-filter-chip.active .status-filter-count{ background:rgba(255,255,255,.25); }
  .status-filter-chip.status-filter-clear{ background:none; border-style:dashed; }

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(30,43,37,.42); display:flex; align-items:center;
    justify-content:center; z-index:100; padding:24px;
  }
  .modal{
    background:var(--panel); border-radius:14px; width:100%; max-width:560px; max-height:88vh;
    overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal.wide{ max-width:760px; }
  .modal-head{ display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:1; }
  .modal-head h3{ margin:0; font-family:var(--font-display); font-size:17px; font-weight:600; }
  .modal-close{ margin-left:auto; border:none; background:transparent; width:28px; height:28px; border-radius:7px; font-size:16px; color:var(--ink-soft); }
  .modal-close:hover{ background:var(--line-soft); }
  .modal-body{ padding:18px 20px; }
  .modal-foot{ padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  .form-grid.c3{ grid-template-columns:1fr 1fr 1fr; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--panel-2);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--teal); background:#fff; }
  .field textarea{ resize:vertical; min-height:56px; }
  .field.span2{ grid-column:span 2; }
  .field.span3{ grid-column:span 3; }
  .date-weekday-hint{ display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-top:3px; }
  .date-overlay-wrap{ position:relative; min-width:176px; flex-shrink:0; }
  .date-overlay-wrap input[type="date"]{ color:transparent; width:100%; min-width:176px; padding-right:34px; box-sizing:border-box; }
  .date-overlay-wrap input[type="date"]::-webkit-datetime-edit,
  .date-overlay-wrap input[type="date"]::-webkit-datetime-edit-fields-wrapper,
  .date-overlay-wrap input[type="date"]::-webkit-datetime-edit-text,
  .date-overlay-wrap input[type="date"]::-webkit-datetime-edit-month-field,
  .date-overlay-wrap input[type="date"]::-webkit-datetime-edit-day-field,
  .date-overlay-wrap input[type="date"]::-webkit-datetime-edit-year-field{ color:transparent; }
  .date-overlay-label{ position:absolute; left:11px; right:32px; top:50%; transform:translateY(-50%); pointer-events:none; font-size:13px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .checks{ display:flex; flex-wrap:wrap; gap:8px; }
  .check-pill{ display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:99px; padding:6px 11px; font-size:12.5px; }
  .check-pill input{ width:auto; }
  fieldset{ border:1px solid var(--line-soft); border-radius:9px; padding:12px 14px; margin:0 0 14px; }
  legend{ font-size:12px; font-weight:700; color:var(--teal-dark); padding:0 6px; }
  .repeat-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; }
  .repeat-row .field{ flex:1; }
  .mini-remove{ border:none; background:var(--line-soft); color:var(--danger); width:32px; height:32px; border-radius:7px; flex-shrink:0; font-weight:700; }
  .add-line{ font-size:12.5px; font-weight:700; color:var(--teal); border:1px dashed var(--teal); background:transparent; border-radius:7px; padding:6px 10px; }

  .holiday-row, .rate-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .holiday-row .date-overlay-wrap{ flex-shrink:0; }
  .rate-row .rname{ width:260px; font-weight:600; font-size:12.5px; flex-shrink:0; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:#fff; padding:10px 18px; border-radius:9px; font-size:13px; font-weight:600; z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  .hidden{ display:none !important; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#D8D2C3; border-radius:99px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>

  if(!err) return 'Unknown error';
  const parts = [err.message, err.details, err.hint].filter(Boolean);
  if(parts.length) return parts.join(' — ');
  try{ return JSON.stringify(err); }catch{ return String(err); }
}

let _lastSyncError = null;
let sbSession = null;
let _agreementPollStarted = false;

/* Wraps a promise with a hard timeout so a stuck network call (very common
   right after a phone/tablet wakes from sleep or a backgrounded tab resumes,
   before the connection re-establishes) can never hang the app forever —
   without this, even a manual refresh just hits the same stuck wait again. */
function withTimeout(promise, ms, timeoutValue){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(()=>resolve(timeoutValue), ms)),
  ]);
}

async function ensureLogin(){
  if(!cloudEnabled) return true;
  const result = await withTimeout(sb.auth.getSession(), 10000, 'timeout');
  if(result === 'timeout'){
    toast('Connection is slow to respond — continuing offline for now. Tap the sync status to retry.');
    cloudEnabled = false;
    setSyncStatus('error','Connection timed out — tap to retry');
    _lastSyncError = 'Could not reach Supabase (timed out) — check your connection and tap the status pill to retry.';
    return false;
  }
  const { data } = result;
  if(data && data.session){ sbSession = data.session; return true; }
  return new Promise((resolve)=>{
    const screen = document.getElementById('loginScreen');
    const emailEl = document.getElementById('loginEmail');
    const passEl = document.getElementById('loginPassword');
    const errEl = document.getElementById('loginError');
    screen.classList.remove('hidden');
    emailEl.focus();
    async function tryLogin(){
      errEl.classList.add('hidden');
      const email = emailEl.value.trim(), password = passEl.value;
      if(!email || !password){ errEl.textContent='Enter your email and password'; errEl.classList.remove('hidden'); return; }
      const { data: signInData, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ errEl.textContent = 'Sign-in failed — ' + error.message; errEl.classList.remove('hidden'); return; }
      sbSession = signInData.session;
      screen.remove();
      resolve(true);
    }
    document.getElementById('loginSubmit').addEventListener('click', tryLogin);
    passEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryLogin(); });
    document.getElementById('loginSkip').addEventListener('click', ()=>{
      screen.remove();
      cloudEnabled = false; // no session — work locally only for this run
      setSyncStatus('off','Not signed in — working locally');
      resolve(false);
    });
  });
}

/* Applies a remote data blob (from either the initial load or a live
   realtime update) onto local state. Shared so both paths run the exact
   same migration/backfill logic instead of drifting apart.
   resetSelection=true (initial load) always jumps to the first customer/pet;
   resetSelection=false (a live update arriving while someone's already
   browsing) instead tries to keep whatever they currently have open, only
   falling back if that record no longer exists in the new data. */
function hydrateStateFromRemote(remote, opts){
  opts = opts || {};
  const resetSelection = opts.resetSelection !== false;
  state.shopName = remote.shopName ?? state.shopName;
  state.customers = (remote.customers ?? state.customers).map(normalizeCustomer); // fallback only — loadFromCloud() overrides this with the authoritative copy from the customers/pets tables right after calling this function (17 Aug 2026 migration); blob value only matters if that table load fails, or for very old un-migrated backups
  // One-time cleanup: auto-created FBG grooming records used to carry a long
  // explanatory blurb in their notes — now they should just say "(Boarding)".
  // Idempotent, so safe to check on every load; only pushes a sync if it
  // actually found something to fix.
  let fbgNotesFixed = 0;
  state.customers.forEach(c=>{
    c.pets.forEach(p=>{
      (p.groomingHistory||[]).forEach(g=>{
        if((g.apptTypes||[]).includes('FBG') && g.notes !== '(Boarding)'){
          g.notes = '(Boarding)';
          fbgNotesFixed++;
        }
      });
    });
  });
  // One-time backfill: free groomings (FBG) earned by a 7+ night dog
  // stay used to only be auto-assigned to the pet the stay was booked
  // under, not to any pet(s) only sharing the room — give those sharing
  // partners the same earned FBG appointments they missed. Scoped to
  // currently-Active stays only (a Past stay's free grooming is moot,
  // the pet's already gone home). Idempotent — skips dates that already
  // have an FBG for that pet.
  let fbgSharingBackfilled = 0;
  state.customers.forEach(c=>{
    c.pets.forEach(p=>{
      (p.stays||[]).forEach(stay=>{
        if(stay.status !== 'Active') return;
        const dates = computeFreeGroomingDates(stay.checkIn, stay.checkOut);
        if(dates.length === 0) return;
        stay.pets.forEach(sp=>{
          (sp.sharingWith||[]).forEach(sharedId=>{
            const { pet: sharedPet, cust: sharedCust } = findPetWithCustomer(sharedId);
            if(!sharedPet || sharedPet.type !== 'Dog') return;
            const owner = sharedCust || c;
            dates.forEach((date, idx)=>{
              const alreadyHas = (sharedPet.groomingHistory||[]).some(g=>(g.apptTypes||[]).includes('FBG') && g.date===date && g.notes==='(Boarding)');
              if(alreadyHas) return;
              const isCheckoutDay = idx === dates.length - 1;
              const slot = findFreeGroomSlot(date, isCheckoutDay ? '10:00' : '16:00', 'Bay 3');
              if(!slot) return;
              sharedPet.groomingHistory.push({
                id: uid('groom'), date, time: slot.time, bay: slot.bay,
                apptTypes: ['FBG'], sizeCode: sharedPet.groomingSize || '', cutCode:'', details:'',
                addons: [], photos: [], status:'Not arrived', notes: '(Boarding)',
                customerId: owner.id, petId: sharedPet.id,
              });
              fbgSharingBackfilled++;
            });
          });
        });
      });
    });
  });
  state.rates = remote.rates ?? state.rates;
  state.surchargeSM = remote.surchargeSM ?? state.surchargeSM;
  state.surchargeLXL = remote.surchargeLXL ?? state.surchargeLXL;
  state.holidays = remote.holidays ?? state.holidays;
  state.closedDates = remote.closedDates ?? state.closedDates;
  state.closedWeekdays = remote.closedWeekdays ?? state.closedWeekdays;
  state.cancellations = remote.cancellations ?? state.cancellations;
  state.changeLog = remote.changeLog ?? state.changeLog;
  state.staff = remote.staff ?? state.staff; // fallback only — loadFromCloud() overrides this with the authoritative copy from the staff/staff_leaves tables right after calling this function; blob value only matters if that table load fails
  state.policyText = remote.policyText ?? state.policyText;
  // One-time repair (13 Aug 2026): deleting a stay used to leave any payment
  // linked to it still tagged with that stayId, which no longer resolved to
  // anything — so the payment showed up nowhere (not on a stay, not in
  // general payments) even though the money was still counted in the
  // customer's total. Strip any such dangling stayId so the payment falls
  // back to "general" and is usable again.
  let orphanedPaymentsFixed = 0;
  state.customers.forEach(c=>{
    (c.payments||[]).forEach(p=>{
      if(!p.stayIds || !p.stayIds.length) return;
      const live = p.stayIds.filter(id=>findStayById(id));
      if(live.length !== p.stayIds.length){ p.stayIds = live; orphanedPaymentsFixed++; }
    });
  });
  if(typeof remote.LARGE_normal === 'number') LARGE.normal = remote.LARGE_normal;
  if(typeof remote.LARGE_holiday === 'number') LARGE.holiday = remote.LARGE_holiday;
  if(resetSelection){
    state.selectedCustomerId = state.customers[0]?.id || null;
    state.selectedPetId = state.customers[0]?.pets[0]?.id || null;
  } else if(!state.customers.some(c=>c.id===state.selectedCustomerId)){
    state.selectedCustomerId = state.customers[0]?.id || null;
    state.selectedPetId = state.customers[0]?.pets[0]?.id || null;
  } else {
    const selCust = state.customers.find(c=>c.id===state.selectedCustomerId);
    if(!selCust.pets.some(p=>p.id===state.selectedPetId)) state.selectedPetId = selCust.pets[0]?.id || null;
  }
  document.getElementById('shopName').value = state.shopName;
  _lastSyncedJSON = JSON.stringify(remote);
  if(fbgNotesFixed>0 || fbgSharingBackfilled>0 || orphanedPaymentsFixed>0) scheduleSync();
}
async function loadFromCloud(){
  if(!cloudEnabled){ setSyncStatus('off','Cloud sync not set up'); return; }
  setSyncStatus('saving','Loading from cloud…');
  try{
    const result = await withTimeout(
      sb.from(SUPABASE_TABLE).select('data').eq('id', WORKSPACE_ID).maybeSingle(),
      10000, 'timeout'
    );
    if(result === 'timeout'){
      throw new Error('Connection timed out — check your internet and tap here to retry.');
    }
    const { data, error } = result;
    if(error) throw error;
    if(data && data.data){
      hydrateStateFromRemote(data.data, {resetSelection:true});
      // Staff & leave now lives in real tables (see migrateStaffFromBlobIfNeeded/
      // loadStaffFromTables above) rather than the blob — one-time-safe migration
      // check, then load the authoritative copy from the tables themselves.
      await migrateStaffFromBlobIfNeeded(data.data.staff);
      await loadStaffFromTables();
      // Same pattern for customers/pets (18 Aug 2026 migration) — reads
      // data.data.customers here ONE more time only as the migration source
      // (the very last blob save that still had it); every save from now on
      // no longer writes customers into the blob at all.
      await migrateCustomersPetsFromBlobIfNeeded(data.data.customers);
      await loadCustomersPetsFromTables();
      // Stays (18 Aug 2026, Phase 4) — must run AFTER loadCustomersPetsFromTables
      // (needs state.customers populated with pets to migrate FROM, since the
      // migration source is whatever's still embedded in each pet's old
      // stays field) and BEFORE anything else reads pet.stays.
      await migrateStaysFromPetsColumnIfNeeded(state.customers);
      await loadStaysFromTables();
      // Grooming (23 Aug 2026, Phase 5) — same ordering reasoning as stays:
      // migrate from whatever's still embedded in state.customers first,
      // then load the authoritative copy from the table.
      await migrateGroomsFromPetsColumnIfNeeded(state.customers);
      await loadGroomsFromTables();
      // Re-apply the same "pick a sensible selected customer/pet" step
      // hydrateStateFromRemote() already did — needed again since
      // state.customers just got replaced with the tables-loaded copy.
      state.selectedCustomerId = state.customers[0]?.id || null;
      state.selectedPetId = state.customers[0]?.pets[0]?.id || null;
      setSyncStatus('ok','Synced');
    } else {
      // nothing saved yet — push current (seed) state as the first save
      await saveToCloudNow();
    }
  } catch(err){
    const msg = describeSupabaseError(err);
    console.error('Supabase load failed:', msg, err);
    _lastSyncError = msg;
    setSyncStatus('error','Cloud load failed — tap for details');
    toast('Cloud load failed: ' + msg);
  }
  _cloudLoaded = true;
  render();
  checkSignedAgreements();
  if(!_agreementPollStarted && cloudEnabled && sbSession){
    _agreementPollStarted = true;
    setInterval(checkSignedAgreements, 60000);
  }
}

function snapshotForCloud(){
  return {
    shopName: state.shopName, rates: state.rates,
    surchargeSM: state.surchargeSM, surchargeLXL: state.surchargeLXL, holidays: state.holidays, closedDates: state.closedDates, closedWeekdays: state.closedWeekdays,
    cancellations: state.cancellations,
    changeLog: state.changeLog,
    staff: state.staff,
    policyText: state.policyText,
    LARGE_normal: LARGE.normal, LARGE_holiday: LARGE.holiday,
  };
}

/* Auto-retry delays for a failed/timed-out save, in ms — before this (17
   Aug 2026), a single failed save just sat there showing "Save failed" until
   someone noticed and tapped it; on a flaky connection that meant frequent
   manual retries. Now a save gets these 3 automatic attempts (with a hard
   10s timeout per attempt, since free-tier Supabase's shared compute can
   occasionally hang rather than error quickly) before finally surfacing an
   error for a human to look at. */
const SAVE_RETRY_DELAYS_MS = [2000, 5000, 10000];
let _saveInFlight = false;

async function saveToCloudNow(){
  if(!cloudEnabled) return;
  if(_saveInFlight){
    // Another save is already mid-retry — don't stack a parallel one, just
    // let this newer snapshot get picked up shortly after the current one
    // finishes (it'll differ from _lastSyncedJSON so it won't be skipped).
    clearTimeout(_syncTimer);
    _syncTimer = setTimeout(saveToCloudNow, 1000);
    return;
  }
  const snap = snapshotForCloud();
  const json = JSON.stringify(snap);
  const custJson = JSON.stringify(state.customers);
  const staysFlat = flattenAllStays(state.customers);
  const staysJson = JSON.stringify(staysFlat);
  const groomsFlat = flattenAllGrooms(state.customers);
  const groomsJson = JSON.stringify(groomsFlat);

  // One "unit" per synced entity — each independently tracks whether it
  // changed, how to sync it, and how to commit its new baseline once synced.
  // Growing this list (23 Aug 2026, adding grooms as the 4th) as a flat
  // parameter list threaded through every retry call was getting fragile —
  // this generic loop scales to future phases (payments/charges, etc.)
  // without adding more positional parameters to get wrong.
  const units = [
    { changed: custJson !== _lastSyncedCustomersJSON,
      run: ()=>syncCustomersAndPetsToTables(_customersBaseline, state.customers),
      commit: ()=>{ _lastSyncedCustomersJSON = custJson; _customersBaseline = JSON.parse(custJson); } },
    { changed: staysJson !== _lastSyncedStaysJSON,
      run: ()=>syncStaysToTables(_staysBaseline, staysFlat),
      commit: ()=>{ _lastSyncedStaysJSON = staysJson; _staysBaseline = JSON.parse(staysJson); } },
    { changed: groomsJson !== _lastSyncedGroomsJSON,
      run: ()=>syncGroomsToTables(_groomsBaseline, groomsFlat),
      commit: ()=>{ _lastSyncedGroomsJSON = groomsJson; _groomsBaseline = JSON.parse(groomsJson); } },
    { changed: json !== _lastSyncedJSON,
      run: async ()=>{
        const result = await withTimeout(
          sb.from(SUPABASE_TABLE).upsert({ id: WORKSPACE_ID, data: snap, updated_at: new Date().toISOString() }),
          10000, 'timeout'
        );
        if(result === 'timeout') throw new Error('Connection timed out');
        if(result.error) throw result.error;
      },
      commit: ()=>{ _lastSyncedJSON = json; } },
  ];
  if(!units.some(u=>u.changed)) { setSyncStatus('ok','Synced'); return; }
  _saveInFlight = true;
  try{
    await attemptSaveWithRetry(units, 0);
  } finally {
    _saveInFlight = false;
  }
}

async function attemptSaveWithRetry(units, attempt){
  setSyncStatus('saving', attempt===0 ? 'Saving…' : `Saving… (retry ${attempt}/${SAVE_RETRY_DELAYS_MS.length})`);
  try{
    // Every sync function here uses upsert()/delete(), both idempotent, so
    // redoing an already-succeeded unit on retry (below) is harmless —
    // that's what makes it safe to just re-run everything that changed
    // rather than track partial progress across attempts.
    for(const u of units){
      if(u.changed) await u.run();
    }
    // Deep clone baselines — a shallow one (spreading a customer/pet but
    // leaving nested arrays like stays/payments as the same in-memory
    // reference) meant a later in-place push silently mutated the
    // "baseline" too, so the next diff always saw zero difference and
    // skipped saving — found 18 Aug 2026. JSON.parse(JSON.stringify(...))
    // in each unit's commit() avoids that.
    units.forEach(u=>{ if(u.changed) u.commit(); });
    _lastSyncError = null;
    setSyncStatus('ok','Synced');
  } catch(error){
    if(attempt < SAVE_RETRY_DELAYS_MS.length){
      await new Promise(res=>setTimeout(res, SAVE_RETRY_DELAYS_MS[attempt]));
      return attemptSaveWithRetry(units, attempt+1);
    }
    const msg = describeSupabaseError(error);
    console.error('Supabase save failed after retries:', msg, error);
    _lastSyncError = msg;
    setSyncStatus('error','Save failed — tap for details');
    toast('Save failed: ' + msg);
  }
}

/* Live co-editing (Realtime auto-refresh + "someone's editing this" badges)
   was tried and removed on request — it wasn't working reliably in practice.
   These two are kept as harmless no-ops rather than ripped out everywhere
   they're called, so nothing else needs to change: broadcastEditing() does
   nothing, editingBadgeHtml() always renders blank. */
function broadcastEditing(){}
function editingBadgeHtml(){ return ''; }
const _activeEditors = {};

function scheduleSync(){
  if(!cloudEnabled || !_cloudLoaded) return;
  setSyncStatus('saving','Saving…');
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(saveToCloudNow, 900);
}

document.getElementById('syncStatus').addEventListener('click', async ()=>{
  const configured = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  if(!configured){
    toast('Add your Supabase URL & anon key at the top of the file\'s script, then reload');
    return;
  }
  const el = document.getElementById('syncStatus');
  if(el.classList.contains('sync-error')){
    if(_lastSyncError) toast(_lastSyncError);
    if(!cloudEnabled){
      // a previous connection attempt (login or initial load) timed out —
      // re-enable and retry the whole connect flow, not just a save.
      cloudEnabled = true;
      setSyncStatus('saving','Reconnecting…');
      const loggedIn = await ensureLogin();
      if(loggedIn) await loadFromCloud();
    } else {
      saveToCloudNow();
    }
  }
});

/* If the tab was backgrounded (screen locked, app-switched away, etc.) and
   cloud sync had failed/timed out, automatically try reconnecting the moment
   the user comes back — rather than leaving them to notice and tap retry. */
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState !== 'visible') return;
  if(cloudEnabled) return; // already connected/working, nothing to do
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return; // never configured, nothing to reconnect
  if(document.getElementById('lockScreen')) return; // still on the PIN screen — don't interrupt
  cloudEnabled = true;
  setSyncStatus('saving','Reconnecting…');
  const loggedIn = await ensureLogin();
  if(loggedIn) await loadFromCloud();
});

/* Retries make a failed save more likely to eventually succeed on its own,
   but they also mean a failure can take longer to resolve — so warn before
   closing/refreshing the tab while a save hasn't gone through yet, rather
   than let someone close it mid-retry and lose an edit that only ever
   existed in this tab. */
window.addEventListener('beforeunload', (e)=>{
  if(!cloudEnabled) return;
  const el = document.getElementById('syncStatus');
  const unsynced = el && (el.classList.contains('sync-saving') || el.classList.contains('sync-error'));
  if(unsynced){ e.preventDefault(); e.returnValue = ''; }
});

   at a glance (pet header, Today grid, booking), instead of relying on
   someone reading through free-typed medical/personality/special-request text. */

/* Preset grooming prices for the "Additional charges" (Grooming category)
   picker on a stay — Bath/Cut are priced by the pet's own grooming size
   (auto-detected from pet.groomingSize), the rest are flat per-visit fees.
   Cat-only services are only offered when the selected pet is a Cat. */
const GROOM_CHARGE_SIZED = {
  Bath: {S:75, M:95, L:125, XL:165, XXL:215},
  Cut: {S:130, M:170, L:230, XL:310, XXL:410},
};
const GROOM_CHARGE_FLAT_COMMON = { 'Trim Nail':15, 'Clean Ear':15, 'Trim Paw Pad':15 };
const GROOM_CHARGE_FLAT_CAT = { 'Cat Basic grooming':90, 'Cat Full Grooming':155 };
/* Returns the list of preset grooming charge options for a given pet, each
   with the auto-computed rate already applied — Bath/Cut use the pet's own
   grooming size (falls back to 'S' if somehow unset). */
function groomChargeOptionsFor(pet){
  if(!pet) return [];
  const opts = [];
  if(pet.type === 'Cat'){
    Object.keys(GROOM_CHARGE_FLAT_CAT).forEach(k=>opts.push({ key:k, label:k, amount:GROOM_CHARGE_FLAT_CAT[k] }));
  } else {
    const size = PET_SIZES.includes(pet.groomingSize) ? pet.groomingSize : 'S';
    Object.keys(GROOM_CHARGE_SIZED).forEach(k=>{
      opts.push({ key:k, label:`${k} (${size})`, amount: GROOM_CHARGE_SIZED[k][size] });
    });
  }
  Object.keys(GROOM_CHARGE_FLAT_COMMON).forEach(k=>opts.push({ key:k, label:k, amount:GROOM_CHARGE_FLAT_COMMON[k] }));
  return opts;
}

/* Wires up the standard checkboxes + custom chips for a multi-select field.
   Returns a getSelected() function to call at save time. */
function wireMultiSelectEditor(prefix, stdOptions, initialSelected){
  const std = new Set(stdOptions);
  document.querySelectorAll(`#${prefix}_stdChecks input[data-std-check]`).forEach(cb=>{
    if(initialSelected.includes(cb.value)) cb.checked = true;
  });
  let custom = initialSelected.filter(a=>!std.has(a));
  function refresh(){
    document.getElementById(`${prefix}_customChecks`).innerHTML = custom.map((a,i)=>
      `<span class="check-pill">${esc(a)} <button type="button" data-rm-custom="${i}" style="border:none;background:none;color:var(--danger);cursor:pointer;font-weight:700;margin-left:2px;">✕</button></span>`
    ).join('');
    document.querySelectorAll(`#${prefix}_customChecks [data-rm-custom]`).forEach(btn=>{
      btn.addEventListener('click', ()=>{ custom.splice(+btn.dataset.rmCustom,1); refresh(); });
    });
  }
  refresh();
  const addBtn = document.getElementById(`${prefix}_customAddBtn`);
  const input = document.getElementById(`${prefix}_customInput`);
  function addCustom(){
    const val = input.value.trim();
    if(!val) return;
    if(!custom.includes(val) && !std.has(val)) custom.push(val);
    input.value=''; input.focus(); refresh();
  }
  addBtn.addEventListener('click', addCustom);
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addCustom(); } });
  return () => [
    ...Array.from(document.querySelectorAll(`#${prefix}_stdChecks input[data-std-check]:checked`)).map(c=>c.value),
    ...custom,
  ];
}
/* Reusable "sharing room with" picker — search-and-add, works across every
   customer's pets (not just the current one), since a room is sometimes
   shared between two unrelated customers' pets. `ids` is the live array to
   mutate in place; `getExcludeId` is a function returning the petId that
   can't be added to itself (the row's own pet), re-checked on every keystroke
   so it stays correct if the pet dropdown changes afterward. */
/* datesMap (optional, mutable object keyed by petId -> {checkIn,checkOut}) lets
   any pet in `ids` have its own check-in/check-out for this shared room,
   different from the stay's own dates — e.g. Pet A boards 13→18 Aug, Pet B
   joins the same room 14→18 Aug. getBaseDates (optional fn) returns the
   stay's current {checkIn, checkOut} to default a newly-enabled override to. */
function sharingChipsInnerHtml(fieldId, ids, datesMap){
  const chips = ids.map(id=>{
    const {pet, cust} = findPetWithCustomer(id);
    if(!pet) return '';
    const label = cust ? `${esc(pet.name)} (${esc(cust.name)})` : esc(pet.name);
    const ov = datesMap && datesMap[id];
    const dateNote = ov ? ` <span style="font-weight:600;color:var(--accent,#1B5EAC);">📅 ${esc(fmtDate(ov.checkIn))}→${esc(fmtDate(ov.checkOut))}</span>` : '';
    return `<span class="check-pill">${label}${dateNote} <button type="button" data-share-rm="${fieldId}:${id}" style="border:none;background:none;color:var(--danger);cursor:pointer;font-weight:700;margin-left:2px;">✕</button></span>`;
  }).join('');
  return chips || '<span style="font-size:12px;color:var(--ink-soft);">Not sharing</span>';
}
function sharingDateRowsHtml(fieldId, ids, datesMap){

}

function wireSharingPicker(fieldId, ids, getExcludeId, datesMap, getBaseDates){
  function refreshAll(){
    const box = document.getElementById(`${fieldId}_chips`);
    if(box) box.innerHTML = sharingChipsInnerHtml(fieldId, ids, datesMap);
    const rowsBox = document.getElementById(`${fieldId}_daterows`);
    if(rowsBox) rowsBox.innerHTML = sharingDateRowsHtml(fieldId, ids, datesMap);
    wireRowEvents();
  }
  function wireRowEvents(){
    document.querySelectorAll(`[data-share-rm^="${fieldId}:"]`).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.shareRm.slice(fieldId.length+1);
        const i = ids.indexOf(id);
        if(i>-1) ids.splice(i,1);
        if(datesMap) delete datesMap[id];
        refreshAll();
      });
    });
    if(!datesMap) return;
    document.querySelectorAll(`[data-share-dates-toggle^="${fieldId}:"]`).forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const id = cb.dataset.shareDatesToggle.slice(fieldId.length+1);
        if(cb.checked){
          const base = getBaseDates ? getBaseDates() : { checkIn: todayStr(), checkOut: addDays(todayStr(),1) };
          datesMap[id] = { checkIn: base.checkIn, checkOut: base.checkOut };
        } else {
          delete datesMap[id];
        }
        refreshAll();
      });
    });
    document.querySelectorAll(`[data-share-dates-in^="${fieldId}:"]`).forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const id = inp.dataset.shareDatesIn.slice(fieldId.length+1);
        if(datesMap[id]) datesMap[id].checkIn = inp.value;
        const box = document.getElementById(`${fieldId}_chips`);
        if(box) box.innerHTML = sharingChipsInnerHtml(fieldId, ids, datesMap);
        wireRowEvents();
      });
    });
    document.querySelectorAll(`[data-share-dates-out^="${fieldId}:"]`).forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const id = inp.dataset.shareDatesOut.slice(fieldId.length+1);
        if(datesMap[id]) datesMap[id].checkOut = inp.value;
        const box = document.getElementById(`${fieldId}_chips`);
        if(box) box.innerHTML = sharingChipsInnerHtml(fieldId, ids, datesMap);
        wireRowEvents();
      });
    });
  }
  wireRowEvents();
  const input = document.querySelector(`[data-share-search="${fieldId}"]`);
  const results = document.getElementById(`${fieldId}_results`);
  if(!input || !results) return;
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.innerHTML=''; return; }
    const excludeId = getExcludeId ? getExcludeId() : null;
    const matches = [];
    state.customers.forEach(c=>{
      c.pets.forEach(p=>{
        if(p.id===excludeId || ids.includes(p.id)) return;
        if(p.name.toLowerCase().includes(q)) matches.push({p,c});
      });
    });
    results.innerHTML = matches.slice(0,6).map(({p,c})=>
      `<button type="button" class="check-pill" data-share-add="${fieldId}:${p.id}" style="cursor:pointer;">+ ${esc(p.name)} (${esc(c.name)})</button>`
    ).join('') || '<span style="font-size:12px;color:var(--ink-soft);">No matching pet</span>';
    document.querySelectorAll(`[data-share-add^="${fieldId}:"]`).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.shareAdd.slice(fieldId.length+1);
        if(!ids.includes(id)) ids.push(id);
        input.value=''; results.innerHTML='';
        refreshAll();
      });
    });
  });
}
const BAYS = ['Bay 1','Bay 2','Bay 3','Bay 4'];
const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TIME_SLOTS = (() => { // 10:00 -> 18:00, 30-min increments
  const out = [];
  for(let mins = 10*60; mins <= 18*60; mins += 30){
    const h = Math.floor(mins/60), m = mins % 60;
    out.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
  }
  return out;
})();

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
/* "Today" is always computed in Malaysia time, regardless of the device's own clock/timezone setting. */
function todayStr(){
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kuala_Lumpur', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
}
function fmtDate(s){ if(!s) return '—'; const d = new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateLong(s){ const d = new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); }
function weekdayShort(s){ if(!s) return ''; const d = new Date(s+'T00:00:00'); return d.toLocaleDateString('en-GB',{weekday:'short'}); }
function fmtDateSlashDay(s){ if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y} (${weekdayShort(s)})`; }
function fmtDateSlash(s){ if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; }
function fmtDateSlashYY(s){ if(!s) return ''; const [y,m,d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; }
/* "14:30" -> "2:30pm", "10:00" -> "10am" (drops :00 on the hour, matching the
   style already used in the check-in/checkout reminder wording). */
function fmtTimeAMPM(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h>=12 ? 'pm' : 'am';
  let h12 = h%12; if(h12===0) h12=12;
  return m===0 ? `${h12}${period}` : `${h12}:${String(m).padStart(2,'0')}${period}`;
}
/* Reusable helpers so every date field in the app — present and future —
   shows its value as dd/mm/yyyy (day) drawn directly inside the field
   itself (native date text hidden via .date-overlay-wrap CSS), instead of
   a separate note next to it. Use dateOverlayHtml() when building a date
   <input>'s markup, then call wireDateOverlay() once it's in the DOM to
   fill the initial text and keep it updated as the value changes. */
function dateOverlayHtml(id, value, showDay=true){
  return `<div class="date-overlay-wrap"><input type="date" id="${id}" value="${value||''}"><span class="date-overlay-label" id="${id}_wd">${value?(showDay?fmtDateSlashDay(value):fmtDateSlash(value)):''}</span></div>`;
}
function wireDateOverlay(id, showDay=true){
  const el = document.getElementById(id);
  const lbl = document.getElementById(id+'_wd');
  if(!el || !lbl) return;
  const update = ()=>{ lbl.textContent = el.value?(showDay?fmtDateSlashDay(el.value):fmtDateSlash(el.value)):''; };
  update();
  el.addEventListener('change', update);
}
function fmtDateWithDay(s){ if(!s) return '—'; return `${fmtDate(s)} (${weekdayShort(s)})`; }

/* Any date within [checkIn, checkOut) that falls inside a defined holiday
   period — used to pop up a heads-up when booking over a special rate. */
function holidayOverlapsForStay(checkIn, checkOut){
  const nights = nightsBetween(checkIn, checkOut);
  const hit = [];
  for(let n=0;n<nights;n++){
    const d = addDays(checkIn, n);
    (state.holidays||[]).forEach(h=>{
      if(d>=h.start && d<=h.end && !hit.some(x=>x.id===h.id)) hit.push(h);
    });
  }
  return hit;
}
/* Shared "why was this cancelled" popup — shown before a grooming appointment
   or boarding stay is actually deleted, so the shop keeps a record of
   whether it was a data-entry mistake or a real customer cancellation.
   `onConfirm(reason, note)` performs the actual deletion + logs it. */
function openCancelReasonModal(title, onConfirm){
  openModal(`
    <div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>Reason for deleting</label>
        <select id="cancelReasonSelect">
          <option value="Customer cancelled">Customer cancelled</option>
          <option value="Wrongly keyed in">Wrongly keyed in</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field"><label>Note (optional)</label><textarea id="cancelReasonNote" placeholder="Any extra detail…"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelReasonBack">Back</button>
      <button class="btn btn-danger" id="cancelReasonConfirm">Delete</button>
    </div>
  `);
  document.getElementById('cancelReasonBack').addEventListener('click', closeModal);
  document.getElementById('cancelReasonConfirm').addEventListener('click', ()=>{
    const reason = document.getElementById('cancelReasonSelect').value;
    const note = document.getElementById('cancelReasonNote').value.trim();
    closeModal();
    onConfirm(reason, note);
  });
}
/* Detaches any payments linked to a stay being deleted, instead of leaving
   them orphaned (still tagged with a stayId that no longer exists, so they
   never appeared in either that stay's card or the customer's general-
   payments list — effectively invisible and unusable). The payment record
   itself, amount and all, is kept: it just drops back to "general" (or stays
   linked to any other stay it was also split across) so it still counts
   toward the customer's balance and can be applied to a future stay. */
function unlinkPaymentsFromStay(cust, stayId){
  if(!cust) return;
  (cust.payments||[]).forEach(p=>{
    if(p.stayIds && p.stayIds.includes(stayId)){
      p.stayIds = p.stayIds.filter(id=>id!==stayId);
    }
  });
}
/* Records one cancelled grooming appointment or boarding stay into the
   Cancellations log (state.cancellations), newest first. `summary` is a
   short human-readable line describing what was deleted (date/time/room etc). */
function logCancellation(type, reason, note, cust, pet, summary){
  state.cancellations.unshift({
    id: uid('cancel'), type, reason, note,
    cancelledAt: new Date().toISOString(),
    customerName: cust ? cust.name : '', petName: pet ? petLabel(pet) : '',
    summary,
  });
}
/* Read-only log of every cancelled grooming appointment / boarding stay,
   newest first, with the reason recorded at delete-time. */
/* =========================================================
   CHANGE LOG — lightweight edit history + undo for prices,
   dates, and notes (the things a mistyped edit most often ruins
   and previously had no record and no way to undo). Each entry
   stores the entity type + a small `ref` describing exactly
   where to find the live record again (works even for nested
   things like one charge inside one stay), the field that
   changed, and its old/new values. Undo just writes the old
   value back and logs that as its own new entry, so the trail
   stays honest instead of being edited away.
   ========================================================= */
function logChange(entityType, ref, entityLabel, field, fieldLabel, oldValue, newValue){
  if((oldValue??'') === (newValue??'')) return;
  if(!Array.isArray(state.changeLog)) state.changeLog = [];
  state.changeLog.unshift({
    id: uid('chg'), ts: new Date().toISOString(), entityType, ref, entityLabel,
    field, fieldLabel: fieldLabel || field, oldValue: oldValue ?? '', newValue: newValue ?? '', undone: false,
  });
  if(state.changeLog.length > 300) state.changeLog.length = 300;
}
function logFieldChanges(entityType, ref, entityLabel, oldObj, newObj, fields, fieldLabels){
  fields.forEach(f=>{
    const ov = oldObj ? oldObj[f] : undefined;
    const nv = newObj ? newObj[f] : undefined;
    logChange(entityType, ref, entityLabel, f, (fieldLabels && fieldLabels[f]) || f, ov, nv);
  });
}
function resolveChangeEntity(entry){
  switch(entry.entityType){
    case 'Pet': { const r = findPetWithCustomer(entry.ref.petId); return r.pet; }
    case 'Stay': return findStayById(entry.ref.stayId);
    case 'Charge': { const s = findStayById(entry.ref.stayId); return s ? s.charges.find(c=>c.id===entry.ref.chargeId) : null; }
    case 'Payment': { const c = getCustomer(entry.ref.custId); return c ? (c.payments||[]).find(p=>p.id===entry.ref.paymentId) : null; }
    default: return null;
  }
}
function undoChange(entryId){
  const entry = (state.changeLog||[]).find(e=>e.id===entryId);
  if(!entry) return;
  const obj = resolveChangeEntity(entry);
  if(!obj){ toast('That record no longer exists — can\'t undo'); return; }
  const currentVal = obj[entry.field];
  obj[entry.field] = entry.oldValue;
  entry.undone = true;
  logChange(entry.entityType, entry.ref, entry.entityLabel, entry.field, entry.fieldLabel, currentVal, entry.oldValue);
  closeModal();
  scheduleSync();
  render();
  toast('Change undone');
}
function changeLogValueDisplay(v){
  if(v === '' || v == null) return '(empty)';
  const s = String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return fmtDate(s);
  return s.length > 70 ? esc(s.slice(0,70))+'…' : esc(s);
}

/* Monthly operations report — revenue breakdown, room occupancy %, grooming
   throughput, and cancellations, all for one calendar month. Room revenue is
   computed night-by-night for nights that actually fall in the chosen month
   (so a stay spanning two months only counts its nights in each correctly);
   additional charges (retail/grooming/other) aren't dated individually, so
   they're attributed to the stay's check-in month as a reasonable proxy —
   this is an operational snapshot for spotting trends, not exact accounting. */
function computeMonthlyReport(monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthDates = new Set();
  for(let d=1; d<=daysInMonth; d++) monthDates.add(`${monthStr}-${String(d).padStart(2,'0')}`);

  let roomRevenue = 0, surchargeRevenue = 0, chargesRevenue = 0, groomingChargeRevenue = 0, paymentsReceived = 0, newStaysStarted = 0;
  const occupiedRoomNights = new Set();

  state.customers.forEach(cust=>{
    cust.pets.forEach(pet=>{
      (pet.stays||[]).forEach(stay=>{
        if(stay.checkIn.slice(0,7) === monthStr) newStaysStarted++;
        // Group into rooms with each occupant's OWN actual window (its per-pet
        // override if the row set one, else the stay's own dates) — mirrors
        // computeStayCost, so pets sharing a room but joining/leaving on
        // different dates are only counted/charged for the nights they're
        // actually there.
        const byRoom = {};
        stay.pets.forEach(sp=>{
          if(!byRoom[sp.room]) byRoom[sp.room] = [];
          const ids = [sp.petId, ...(sp.sharingWith||[])].filter(Boolean);
          ids.forEach(id=>{
            if(byRoom[sp.room].some(o=>o.petId===id)) return;
            byRoom[sp.room].push({ petId: id, ...petDatesInStay(stay, sp, id) });
          });
        });
        Object.entries(byRoom).forEach(([roomId, occupants])=>{
          const room = roomTypeFor(roomId);
          if(!room || occupants.length===0) return;
          const roomCheckIn = occupants.map(o=>o.checkIn).sort()[0];
          const roomCheckOut = occupants.map(o=>o.checkOut).sort().slice(-1)[0];
          const roomNights = nightsBetween(roomCheckIn, roomCheckOut);
          for(let n=0;n<roomNights;n++){
            const dateStr = addDays(roomCheckIn, n);
            if(!monthDates.has(dateStr)) continue;
            const presentToday = occupants.filter(o => dateStr >= o.checkIn && dateStr < o.checkOut);
            if(presentToday.length===0) continue;
            occupiedRoomNights.add(`${roomId}|${dateStr}`);
            const holiday = isHoliday(dateStr);
            let rate;
            if(room.type==='Dog Deluxe (Bottom)' || room.type==='Dog Deluxe (Upper)'){
              const anyLarge = presentToday.some(o=>{ const p=findPetById(o.petId); return p && ['L','XL','XXL'].includes(p.boardingSize); });
              rate = anyLarge ? LARGE : state.rates[room.type];
            } else rate = state.rates[room.type];
            if(!rate) rate = {normal:0, holiday:0};
            const usingCustomRate = stay.customRate != null && stay.customRate >= 0;
            const standardRate = holiday ? rate.holiday : rate.normal;
            let nightRate = standardRate;
            if(usingCustomRate){
              nightRate = stay.customRateMode==='percent' ? standardRate*(1-Math.min(stay.customRate,100)/100) : stay.customRate;
            }
            roomRevenue += nightRate;
            if(presentToday.length>1){
              presentToday.slice(1).forEach(o=>{
                const p = findPetById(o.petId);
                const isLarge = p && ['L','XL','XXL'].includes(p.boardingSize);
                surchargeRevenue += isLarge ? state.surchargeLXL : state.surchargeSM;
              });
            }
          }
        });
        if(stay.checkIn.slice(0,7) === monthStr){
          (stay.charges||[]).forEach(c=>{
            const amt = (+c.amount||0)*(+c.qty||1);
            if(c.category==='Grooming') groomingChargeRevenue += amt; else chargesRevenue += amt;
          });
        }
      });
      (cust.payments||[]).forEach(p=>{
        if(p.date && p.date.slice(0,7)===monthStr) paymentsReceived += (+p.amount||0);
      });
    });
  });

  let groomingBooked = 0, groomingCompleted = 0;
  state.customers.forEach(cust=>{
    cust.pets.forEach(pet=>{
      (pet.groomingHistory||[]).forEach(g=>{
        if(g.date && g.date.slice(0,7)===monthStr){
          groomingBooked++;
          if(g.status==='Picked up') groomingCompleted++;
        }
      });
    });
  });

  const cancellationsThisMonth = (state.cancellations||[]).filter(c=>c.cancelledAt && c.cancelledAt.slice(0,7)===monthStr);
  const cancelByReason = {};
  cancellationsThisMonth.forEach(c=>{ cancelByReason[c.reason] = (cancelByReason[c.reason]||0)+1; });

  const totalRoomNightsAvailable = ROOM_INVENTORY.length * daysInMonth;
  const occupancyPct = totalRoomNightsAvailable>0 ? (occupiedRoomNights.size/totalRoomNightsAvailable*100) : 0;

  return {
    monthStr, daysInMonth,
    roomRevenue, surchargeRevenue, chargesRevenue, groomingChargeRevenue,
    totalRevenue: roomRevenue+surchargeRevenue+chargesRevenue+groomingChargeRevenue,
    paymentsReceived,
    occupiedRoomNights: occupiedRoomNights.size, totalRoomNightsAvailable, occupancyPct,
    newStaysStarted, groomingBooked, groomingCompleted,
    cancellationsCount: cancellationsThisMonth.length, cancelByReason,
  };
}
/* Forward-looking occupancy — unlike the monthly report (which only shows
   what already happened), this projects the next N days from stays already
   booked, so a near-full stretch can be spotted and acted on (e.g. push
   marketing, or flag a holiday period filling up) while there's still time,
   not just after the fact. */
function computeUpcomingOccupancy(days){
  const totalRooms = ROOM_INVENTORY.length;
  const today = todayStr();
  const out = [];
  for(let n=0; n<days; n++){
    const dateStr = addDays(today, n);
    const roomsBooked = new Set();
    state.customers.forEach(cust=>{
      cust.pets.forEach(pet=>{
        (pet.stays||[]).forEach(stay=>{
          if(stay.status!=='Active') return;
          stay.pets.forEach(sp=>{
            if(!sp.room) return;
            const w = spRoomWindow(stay, sp);
            if(dateStr>=w.checkIn && dateStr<w.checkOut) roomsBooked.add(sp.room);
          });
        });
      });
    });
    const occupied = roomsBooked.size;
    out.push({ date: dateStr, occupied, totalRooms, pct: totalRooms>0 ? (occupied/totalRooms*100) : 0 });
  }
  return out;
}
function upcomingOccupancyHtml(days){

    </div>
  </div>`;
}
